name: Nix cache

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - workbench/catbox/**
      - .github/workflows/nix-cache.yaml
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.system }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Setup niks3 cache
        uses: Mic92/niks3-action@6d24bc1d87acdfac8e5dc3266f7b28ae99051adf # v1.5.0
        with:
          server-url: https://niks3.terence.cloud
      - name: Build
        run: |
          set -euo pipefail
          # Every package for this system — new flake outputs join
          # automatically. (nix build . alone needs a "default" attr.)
          attrs=$(nix eval --json '.#packages.${{ matrix.system }}' --apply builtins.attrNames | jq -r '.[]')
          for attr in $attrs; do
            echo "## $attr (${{ matrix.system }})"
            nix build --print-out-paths ".#$attr" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # PR validation for the packages workbench-ci cannot build: the catbox
  # nix package (go toolchain, vendorHash) and the APK's gradle
  # dependency set (verification metadata, FOD hash) are only proven by
  # the hermetic nix builds. Pushes to the cache so the same build on
  # main is served from it.
  catbox-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-catbox-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect catbox nix changes
        id: catbox
        run: |
          base="origin/${{ github.base_ref }}"
          mb=$(git merge-base "$base" HEAD)
          if git diff --name-only "$mb" HEAD | grep -qE '^(flake\.(nix|lock)|\.github/workflows/nix-cache\.yaml|workbench/catbox/(go\.(mod|sum)|nix/|android/))'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Nix
        if: steps.catbox.outputs.changed == 'true'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Setup niks3 cache
        if: steps.catbox.outputs.changed == 'true'
        uses: Mic92/niks3-action@6d24bc1d87acdfac8e5dc3266f7b28ae99051adf # v1.5.0
        with:
          server-url: https://niks3.terence.cloud
      - name: Build catbox nix packages
        if: steps.catbox.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix build --print-out-paths .#catbox .#catbox-android-bin .#catbox-android | tee -a "$GITHUB_STEP_SUMMARY"
