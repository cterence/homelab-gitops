name: Workbench CI

on:
  pull_request:
    paths:
      - workbench/**

concurrency:
  group: workbench-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect changed workbench apps
    runs-on: ubuntu-latest
    outputs:
      go-apps: ${{ steps.apps.outputs.go }}
      docker-apps: ${{ steps.apps.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed apps
        id: apps
        run: |
          base="origin/${{ github.base_ref }}"
          mb=$(git merge-base "$base" HEAD)
          apps=$(git diff --name-only "$mb" HEAD -- workbench/ | cut -d/ -f2 | sort -u)
          go="[]"; docker="[]"
          for app in $apps; do
            [ -f "workbench/$app/go.mod" ] && go=$(jq -c --arg a "$app" '. + [$a]' <<<"$go")
            [ -f "workbench/$app/Dockerfile" ] && docker=$(jq -c --arg a "$app" '. + [$a]' <<<"$docker")
          done
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  test-go:
    name: Test Go (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.go-apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.go-apps) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: workbench/${{ matrix.app }}/go.mod
          cache-dependency-path: workbench/${{ matrix.app }}/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: workbench/${{ matrix.app }}
      - name: Test
        run: go test ./...
        working-directory: workbench/${{ matrix.app }}
      - name: Integration tests
        run: |
          if [ ! -f integration_test.go ]; then
            echo "no integration_test.go, skipping"
            exit 0
          fi
          # Convention: apps gate their e2e behind <APP>_INTEGRATION=1.
          gate="$(echo "$APP" | tr '[:lower:]-' '[:upper:]_')_INTEGRATION=1"
          env "$gate" go test . -run TestIntegration -v -count=1
        env:
          APP: ${{ matrix.app }}
        working-directory: workbench/${{ matrix.app }}
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: workbench/${{ matrix.app }}

  build-image:
    name: Build image (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.docker-apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.docker-apps) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build (no push, mirrors Kaniko context-sub-path)
        run: docker build -t ci/${{ matrix.app }}:pr .
        working-directory: workbench/${{ matrix.app }}
