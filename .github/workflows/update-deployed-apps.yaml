name: Update deployed apps table

on:
  push:
    branches:
      - main
    paths:
      - argocd-apps/applicationset.yaml
      - k8s-apps/**
  workflow_dispatch:

permissions: {}

jobs:
  update-deployed-apps-table:
    runs-on: ubuntu-latest
    steps:
      # github-actions[bot] cannot push to main (required status checks);
      # this app is a bypass actor, same as workbench-tag-bump.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.WORKBUMP_APP_ID }}
          private-key: ${{ secrets.WORKBUMP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Update deployed apps table
        run: ./scripts/update-deployed-apps.sh
      - name: Commit and push
        run: |
          git config user.name "homelab-workbench-bump[bot]"
          git config user.email "${{ secrets.WORKBUMP_APP_ID }}+homelab-workbench-bump[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "table unchanged"
            exit 0
          fi
          git commit -m "docs: [ci] updated deployed apps table"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
