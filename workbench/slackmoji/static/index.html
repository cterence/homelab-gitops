<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>slackmoji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="canvas">
  <div class="title-row">
    <div>
      <h1>slackmoji</h1>
      <p class="sub">Shrink a GIF to Slack emoji limits: 128&nbsp;KB, 128&nbsp;px.</p>
    </div>
  </div>

  <section class="panel">
    <header>
      <h2>Input</h2>
      <span class="meta">GIF, PNG, JPEG or WebP, up to 32&nbsp;MB</span>
    </header>

    <div class="drop" id="drop">
      <input type="file" id="file" name="file"
             accept=".gif,.png,.jpg,.jpeg,.webp,image/gif,image/png,image/jpeg,image/webp">
      <label for="file" class="drop-label">Choose a file</label>
      <span class="drop-hint">or drop it here</span>
      <span class="file-name" id="file-name" hidden></span>
    </div>

    <div class="adjust-row">
      <fieldset class="preset">
        <legend>Shape</legend>
        <div class="segmented" role="radiogroup" aria-label="Shape">
          <label>
            <input type="radio" name="mode" value="square" checked>
            <span>Stretch to square</span>
          </label>
          <label>
            <input type="radio" name="mode" value="ratio">
            <span>Keep aspect</span>
          </label>
        </div>
      </fieldset>

      <div class="slider">
        <label for="frames-slider" class="slider-label">Frames</label>
        <div class="slider-stack">
          <input type="range" id="frames-slider" min="1" max="100" value="100" step="1" disabled>
          <div class="slider-ends"><span id="frames-min">1</span><span id="frames-base">base</span></div>
        </div>
        <span class="slider-value" id="frames-out">all</span>
        <label class="lock"><input type="checkbox" id="lock-frames"> lock</label>
      </div>

      <div class="slider">
        <label for="colors-slider" class="slider-label">Colors</label>
        <div class="slider-stack">
          <input type="range" id="colors-slider" min="16" max="255" value="255" step="1" disabled>
          <div class="slider-ends"><span id="colors-min">16</span><span id="colors-base">base</span></div>
        </div>
        <span class="slider-value" id="colors-out">best</span>
        <label class="lock"><input type="checkbox" id="lock-colors"> lock</label>
      </div>

      <div class="slider">
        <label for="size-slider" class="slider-label">Size</label>
        <div class="slider-stack">
          <input type="range" id="size-slider" min="32" max="128" value="128" step="1" disabled>
          <div class="slider-ends"><span id="size-min">32 px</span><span id="size-base">base</span></div>
        </div>
        <span class="slider-value" id="size-out">128 px</span>
        <label class="lock"><input type="checkbox" id="lock-size"> lock</label>
      </div>

      <button type="button" class="card-link adjust-reset" id="reset-btn" hidden>Reset to optimal</button>
    </div>
  </section>

  <section class="panel result">
    <header>
      <h2>Result</h2>
      <span class="meta-group">
        <span class="meta" id="result-meta"></span>
        <span class="spinner" id="spinner" hidden aria-label="Converting"></span>
      </span>
    </header>

    <div class="result-row">
      <div class="preview" id="preview-col" hidden>
        <div class="preview-slot">
          <img id="preview" alt="">
        </div>
        <button type="button" class="primary" id="download-btn" hidden>Download</button>
      </div>

      <div class="result-side">
        <dl class="ledger" id="ledger">
          <div><dt>Size</dt><dd id="f-size">128 KB max</dd></div>
          <div><dt>Dimensions</dt><dd id="f-dims">128 × 128 px max</dd></div>
          <div><dt>Frames</dt><dd id="f-frames">all kept</dd></div>
          <div><dt>Colors</dt><dd id="f-colors">reduced if needed</dd></div>
          <div><dt>Input</dt><dd id="f-input">32 MB max</dd></div>
        </dl>

        <p class="error" id="error" role="alert" hidden></p>
      </div>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
