            - path: /home/filebrowser/data/database

    filebrowser-quantum-config:
      type: configMap
      identifier: filebrowser-quantum-config
      advancedMounts:
        filebrowser-quantum:
          filebrowser-quantum:
            - path: /home/filebrowser/data/config.yaml
              subPath: config.yaml

  configMaps:
    tunnel-monitor-config:
      includeChecksumInControllers:
        - qbittorrent
      data:
        blackbox.yml: |
          modules:
            icmp_tunnel:
              prober: icmp
              timeout: 5s
              icmp:
                preferred_ip_protocol: ip4

    configarr-config:
      includeChecksumInControllers:
        - configarr
      data:
        config.yml: |
          trashGuideUrl: https://github.com/TRaSH-Guides/Guides
          recyclarrConfigUrl: https://github.com/recyclarr/config-templates

          customFormatDefinitions:
            # c411 names dual-audio releases "MULTi.VFF/VF2"; radarr parses those
            # as French, so TRaSH "Language: Not Original" blocks every MULTi
            # release. Zero it and block real dub-only titles by name instead.
            - trash_id: fr-dub-only-not-multi
              trash_scores:
                default: -10000
              name: "FR: Dub-Only (no MULTi)"
              includeCustomFormatWhenRenaming: false
              specifications:
                # radarr CF specs are OR-ed when non-required; use one
                # negative-lookahead regex instead of negate+required combos
                - name: dub token without MULTI
                  implementation: ReleaseTitleSpecification
                  negate: false
                  required: false
                  fields:
                    value: "^(?!.*MULTI).*\\b(VFF|VFI|VFQ|VF2|VF|TRUEFRENCH|FRENCH)\\b"

          sonarr:
            series:
              base_url: http://arr-stack-sonarr:8989
              api_key: !secret SONARR_API_KEY

              quality_definition:
                type: series

              delete_unmanaged_custom_formats:
                enabled: true

              include:
                # [French MULTi.VO] HD Bluray + WEB (1080p)
                # french-multi-vo score set: FR Scene +1500, dual audio +500, FR LQ/FastSUB -10000
                - template: 4c48f506c1116a3a57ae33f12346bd15
                  source: TRASH

              custom_formats:
                - trash_ids:
                    - ae575f95ab639ba5d15f663bf019e3e8 # Language: Not Original
                  assign_scores_to:
                    - name: "[French MULTi.VO] HD Bluray + WEB (1080p)"
                      score: 0
                - trash_ids:
                    - fr-dub-only-not-multi
                  assign_scores_to:
                    - name: "[French MULTi.VO] HD Bluray + WEB (1080p)"
                      score: -10000

          radarr:
            movies:
              base_url: http://arr-stack-radarr:7878
              api_key: !secret RADARR_API_KEY

              quality_definition:
                type: movie

              delete_unmanaged_custom_formats:
                enabled: true

              include:
                # [French MULTi.VO] HD Bluray + WEB
                - template: 2572ce3ea4eef1c19d59e0e20ed1cea7
                  source: TRASH
                # [French MULTi.VO] HD Remux (1080p)
                - template: c6460a102b312200c095a2d0982e0461
                  source: TRASH

              # profile language must be Any: the default "Original" rejects
              # every c411 title, since MULTi/VFx parses as French
              quality_profiles:
                - name: "[French MULTi.VO] HD Bluray + WEB"
                  language: Any
                - name: "[French MULTi.VO] HD Remux (1080p)"
                  language: Any

              custom_formats:
                - trash_ids:
                    - d6e9318c875905d6cfb5bee961afcea9 # Language: Not Original
                  assign_scores_to:
                    - name: "[French MULTi.VO] HD Bluray + WEB"
                      score: 0
                    - name: "[French MULTi.VO] HD Remux (1080p)"
                      score: 0
                - trash_ids:
                    - fr-dub-only-not-multi
                  assign_scores_to:
                    - name: "[French MULTi.VO] HD Bluray + WEB"
                      score: -10000
                    - name: "[French MULTi.VO] HD Remux (1080p)"
                      score: -10000
    filebrowser-quantum-config:
      includeChecksumInControllers:
        - filebrowser-quantum
      data:
        config.yaml: |
          server:
            database:
              path: "/home/filebrowser/data/database/filebrowser.sqlite"
              migrateFrom: "/home/filebrowser/data/database/database.db.old"
            sources:
              - path: "/data"
                config: {}
              - path: "/data-pool"
                config: {}
              - path: "/music"
                config: {}
          http:
            port: 8080
          auth:
            methods:
              noauth: true
          userDefaults:
            account:
              permissions:
                api: true
                admin: true
                share: true
                realtime: true

  rawResources:
    storage-pool-pv:
      enabled: true
      forceRename: storage-pool
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 8Ti
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: nfs
          mountOptions:
            - hard
            - nfsvers=4.1
            - nosuid
            - noexec
            - timeo=600
            - retrans=2
          nfs:
            path: /storage-pool
            server: 192.168.1.141
    storage-pool-pvc:
      enabled: true
      forceRename: storage-pool
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Ti
          storageClassName: nfs
          volumeName: storage-pool
    music-shared-pv:
      enabled: true
      forceRename: music-shared
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 100Gi
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: shared-local
          claimRef:
            name: music-shared
            namespace: arr-stack
          local:
            path: /opt/local-path-provisioner/pvc-08a2cbb6-e7ab-4ba4-b8d4-fc906f0e4931_music_music
          nodeAffinity:
            required:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - homelab2
    music-shared-pvc:
      enabled: true
      forceRename: music-shared
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: shared-local
          volumeName: music-shared
    jellystat-jwt-secret:
      enabled: true
      forceRename: jellystat-jwt-secret
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: jellystat-jwt-secret
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password
    sablier-js:
      enabled: true
      forceRename: sablier-js
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: jellyseer
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: js
    sablier-fbq:
      enabled: true
      forceRename: sablier-fbq
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: filebrowser
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: fbq
    qbittorrent-tunnel-monitor:
      enabled: true
      forceRename: qbittorrent-tunnel
      manifest:
        apiVersion: monitoring.coreos.com/v1
        kind: ServiceMonitor
        metadata:
          labels:
            app.kubernetes.io/name: qbittorrent-tunnel
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              app.kubernetes.io/service: "{{ .Release.Name }}-qbittorrent"
          endpoints:
            - port: probe
              path: /probe
              interval: 60s
              scrapeTimeout: 10s
              params:
                module:
                  - icmp_tunnel
                target:
                  - 192.168.2.1
              metricRelabelings:
                - action: replace
                  sourceLabels: [__name__]
                  targetLabel: tunnel
                  replacement: qbittorrent-wg
    qbittorrent-tunnel-rule:
      enabled: true
      forceRename: qbittorrent-tunnel
      manifest:
        apiVersion: monitoring.coreos.com/v1
        kind: PrometheusRule
        spec:
          groups:
            - name: wireguard-tunnel
              rules:
                - alert: WireguardTunnelDown
                  expr: probe_success{service="{{ .Release.Name }}-qbittorrent"} == 0
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: qBittorrent wireguard tunnel down
                    description: >-
                      ICMP probe to the wireguard peer 192.168.2.1 through gluetun has
                      failed for over 2 minutes. The tunnel to free-oracle-arm-1 is
                      likely down.
                - alert: WireguardTunnelProbeMissing
                  expr: absent(probe_success{service="{{ .Release.Name }}-qbittorrent"})
                  for: 10m
                  labels:
                    severity: warning
                  annotations:
                    summary: qBittorrent wireguard tunnel probe missing
                    description: >-
                      No probe_success metric from the qbittorrent tunnel monitor for
                      over 10 minutes. The sidecar or ServiceMonitor may be broken.

cnpg-cluster-jellystat:
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 1
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql
    storage:
      size: 5Gi
    roles:
      - name: jellystat
        connectionLimit: -1
        ensure: present
        createdb: true
        inherit: true
        login: true
    resources: {}
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    logLevel: "info"
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
      prometheusRule:
        excludeRules:
          - CNPGClusterLogicalReplicationErrorsCritical
          - CNPGClusterLogicalReplicationErrors
          - CNPGClusterLogicalReplicationStoppedCritical
          - CNPGClusterLogicalReplicationStopped
          - CNPGClusterHACritical
          - CNPGClusterHAWarning
    postgresql: {}
    initdb:
      database: jellystat
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: http://garage.garage:3900
    destinationPath: s3://cnpg-backups/jellystat
    provider: s3
    s3:
      region: us-east-1
      bucket: cnpg-backups
      path: /jellystat
    secret:
      create: false
      name: cnpg-backup-s3-creds
    wal:
      compression: gzip
      encryption: ""
      maxParallel: 1
    data:
      compression: gzip
      encryption: ""
      jobs: 2
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 1 * * *"
        backupOwnerReference: self
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
    retentionPolicy: "7d"
