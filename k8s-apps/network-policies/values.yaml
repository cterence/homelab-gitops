podCIDR: 10.244.0.0/16
nodeCIDR: 192.168.1.0/24

namespaces:
  - name: argocd
    defaultDeny: true
    nodeProbes: true
    allow: [traefik, monitoring, tailscale-operator]
  - name: opentelemetry-operator
    defaultDeny: true
    nodeProbes: true
    allow: [kube-system, monitoring]
  - name: arr-stack
    defaultDeny: true
    allow:
      [
        traefik,
        go-healthcheck,
        cnpg-system,
        monitoring,
        seerr,
        tailscale-operator,
      ]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: audiobookshelf
    defaultDeny: true
    allow: [traefik]
  - name: catbox
    defaultDeny: true
    allow: [monitoring]
  - name: cert-manager
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: changedetection
    defaultDeny: true
    allow: [traefik]
  - name: cilium-secrets
    defaultDeny: true
  - name: cnpg-restore-test
    defaultDeny: true
    allow: [cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: cnpg-system
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: convertx
    defaultDeny: true
    allow: [traefik]
  - name: default
    defaultDeny: true
  - name: external-dns
    defaultDeny: true
    allow: [monitoring]
  - name: external-secrets
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: falco
    defaultDeny: true
    allow: [monitoring]
  - name: garage
    defaultDeny: true
    allow:
      [
        arr-stack,
        cnpg-restore-test,
        gitea,
        home-assistant,
        immich,
        jellystat,
        monitoring,
        niks3,
        opencloud,
        paperless-ngx,
        pocket-id,
        tailscale-operator,
        traefik,
        vaultwarden,
        velero,
      ]
  - name: garage-backup
    defaultDeny: true
    allow: [monitoring, tailscale-operator, velero]
  - name: gitea
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: go-healthcheck
    defaultDeny: true
    allow: [traefik]
  - name: home-assistant
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: httpbin
    defaultDeny: true
    allow: [traefik]
  - name: hubble-exporter
    defaultDeny: true
  - name: immich
    defaultDeny: true
    allow:
      [traefik, go-healthcheck, tailscale-operator, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: jellyfin
    defaultDeny: true
    allow: [traefik, go-healthcheck, monitoring, jellystat, seerr]
  - name: jellystat
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring, jellyfin]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: kube-system
    defaultDeny: true
    allowRemoteNode: true
    allow: [hubble-exporter]
    allowClusterIngressPorts:
      - { port: 53, protocol: UDP }
      - { port: 53, protocol: TCP }
      - { port: 9153, protocol: TCP }
    remoteNodePorts:
      - { port: 53, protocol: UDP }
      - { port: 53, protocol: TCP }
  - name: lastfm-scrobble-deduplicator
    defaultDeny: true
  - name: local-path-provisioner
    defaultDeny: true
  - name: loki
    defaultDeny: true
    allow: [monitoring, opentelemetry-collector]
  - name: metallb
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: microbin
    defaultDeny: true
    allow: [traefik]
  - name: monitoring
    defaultDeny: true
    allow:
      [
        cnpg-restore-test,
        garage,
        kube-system,
        loki,
        tailscale-operator,
        traefik,
      ]
  - name: mosquitto
    defaultDeny: true
    allow: [home-assistant, zigbee2mqtt]
  - name: music
    defaultDeny: true
    allow: [traefik, tailscale-operator]
  - name: network-policies
    defaultDeny: true
  - name: niks3
    defaultDeny: true
    allow:
      [traefik, go-healthcheck, tailscale-operator, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: opencloud
    defaultDeny: true
    allow: [traefik, tailscale-operator]
  - name: opentelemetry-collector
    defaultDeny: true
    allow: [tailscale-operator, monitoring, cnpg-restore-test, pocket-id]
  - name: paperless-ngx
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: pocket-id
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: registry
    defaultDeny: true
    allowClusterIngressPorts:
      - { port: 5000, protocol: TCP }
    allow: [traefik, tailscale-operator, workbench]
  - name: reloader
    defaultDeny: true
    allow: [monitoring]
  - name: sablier
    defaultDeny: true
    allow: [traefik]
  - name: seerr
    defaultDeny: true
    allow: [traefik, arr-stack, sablier]
  - name: slackmoji
    defaultDeny: true
    allow: [traefik]
  - name: tailscale-operator
    defaultDeny: true
    allowWorldIngress: true
    allowRemoteNode: true
    allow: [go-healthcheck, monitoring, kube-system, opencloud]
  - name: telegram-hub
    defaultDeny: true
    allow: [traefik, tailscale-operator]
  - name: traefik
    defaultDeny: true
    allowWorldIngress: true
    allow: [monitoring]
  - name: vaultwarden
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
    allowFromPorts: [{ from: kube-system, port: 8000, protocol: TCP }]
  - name: velero
    defaultDeny: true
    allow: [monitoring]
  - name: workbench
    defaultDeny: true
  - name: zigbee2mqtt
    defaultDeny: true
    allow: [traefik]
