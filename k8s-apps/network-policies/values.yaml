podCIDR: 10.244.0.0/16
nodeCIDR: 192.168.1.0/24

# allow lists are per namespace; same-namespace is always allowed.
# Policies render only where defaultDeny or nodeProbes is set.
namespaces:
  - name: argocd
    defaultDeny: true
    nodeProbes: true # chart netpols block kubelet probes under cilium
    allow: [traefik, monitoring, tailscale-operator]
  - name: opentelemetry-operator
    defaultDeny: true
    nodeProbes: true
    allow: [kube-system, monitoring]
  - name: arr-stack
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: audiobookshelf
    defaultDeny: true
    allow: [traefik]
  - name: catbox
    defaultDeny: true
    allow: [monitoring]
  - name: cert-manager
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: changedetection
    defaultDeny: true
    allow: [traefik]
  - name: cilium-secrets
    defaultDeny: true
  - name: cnpg-restore-test
    defaultDeny: true
  - name: cnpg-system
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: convertx
    defaultDeny: true
    allow: [traefik]
  - name: default
    defaultDeny: true
  - name: docs
    defaultDeny: true
    allow: [traefik]
  - name: external-dns
    defaultDeny: true
    allow: [monitoring]
  - name: external-secrets
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: falco
    defaultDeny: true
    allow: [monitoring]
  - name: gitea
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: go-healthcheck
    defaultDeny: true
    allow: [traefik]
  - name: home-assistant
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: httpbin
    defaultDeny: true
    allow: [traefik]
  - name: hubble-registry
    # registry-only streamer to the relay; no inbound callers
    defaultDeny: true
  - name: immich
    defaultDeny: true
    allow: [traefik, go-healthcheck, tailscale-operator, cnpg-system, monitoring]
  - name: kube-system
    # coredns serves the whole cluster; apiserver reaches metrics-server via
    # konnectivity-agent (same ns). cilium-agent/kube-proxy are hostNetwork,
    # policies do not apply to them. monitoring scrapes coredns metrics on
    # 9153; node-masqueraded pods need the remote-node CNP for plain DNS.
    defaultDeny: true
    allow: [hubble-registry]
    allowClusterIngressPorts:
      - {port: 53, protocol: UDP}
      - {port: 53, protocol: TCP}
      - {port: 9153, protocol: TCP}
    allowRemoteNode: true
    remoteNodePorts:
      - {port: 53, protocol: UDP}
      - {port: 53, protocol: TCP}
  - name: lastfm-scrobble-deduplicator
    defaultDeny: true
  - name: local-path-provisioner
    defaultDeny: true
  - name: loki
    defaultDeny: true
    allow: [monitoring, opentelemetry-collector]
  - name: metallb
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: microbin
    defaultDeny: true
    allow: [traefik]
  - name: monitoring
    defaultDeny: true
    allow: [kube-system, traefik, tailscale-operator, monitoring]
  - name: mosquitto
    defaultDeny: true
    allow: [home-assistant, zigbee2mqtt]
  - name: network-policies
    defaultDeny: true
  - name: niks3
    defaultDeny: true
    allow: [traefik, go-healthcheck, tailscale-operator, cnpg-system, monitoring]
  - name: opencloud
    defaultDeny: true
    allow: [traefik]
  - name: opentelemetry-collector
    defaultDeny: true
    allow: [tailscale-operator, monitoring]
  - name: paperless-ngx
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: pocket-id
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: registry
    defaultDeny: true
    allow: [traefik, tailscale-operator, workbench]
  - name: reloader
    defaultDeny: true
    allow: [monitoring]
  - name: sablier
    defaultDeny: true
  - name: slackmoji
    defaultDeny: true
    allow: [traefik]
  - name: tailscale-operator
    defaultDeny: true
    allowWorldIngress: true
    allowRemoteNode: true
    allow: [monitoring]
  - name: telegram-hub
    defaultDeny: true
    allow: [traefik, tailscale-operator]
  - name: traefik
    defaultDeny: true
    allowWorldIngress: true
    allow: [monitoring]
  - name: trivy-system
    defaultDeny: true
    allow: [monitoring]
  - name: vaultwarden
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: velero
    defaultDeny: true
    allow: [monitoring]
  - name: versity-gw
    # cnpg barman backups and velero push to versity; the public health check
    # reaches it via the traefik hostname, tailnet via ts proxies.
    defaultDeny: true
    allow: [traefik, tailscale-operator, arr-stack, gitea, home-assistant, immich, niks3, paperless-ngx, pocket-id, vaultwarden, velero]
  - name: workbench
    defaultDeny: true
  - name: zigbee2mqtt
    defaultDeny: true
    allow: [traefik]
