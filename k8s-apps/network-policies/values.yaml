podCIDR: 10.244.0.0/16
nodeCIDR: 192.168.1.0/24

# allow lists are per namespace; same-namespace is always allowed.
# Policies render only where defaultDeny or nodeProbes is set.
namespaces:
  - name: argocd
    nodeProbes: true # chart netpols block kubelet probes under cilium
    allow: [traefik, monitoring, tailscale-operator]
  - name: opentelemetry-operator
    nodeProbes: true
    allow: [kube-system, monitoring]
  - name: arr-stack
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: audiobookshelf
    defaultDeny: true
    allow: [traefik]
  - name: catbox
    defaultDeny: true
    allow: [monitoring]
  - name: cert-manager
    defaultDeny: true
    allow: [kube-system, monitoring]
  - name: changedetection
    defaultDeny: true
    allow: [traefik]
  - name: cilium-secrets
    defaultDeny: true
  - name: cnpg-restore-test
    defaultDeny: true
  - name: cnpg-system
    allow: [monitoring]
  - name: convertx
    defaultDeny: true
    allow: [traefik]
  - name: default
    defaultDeny: true
  - name: docs
    defaultDeny: true
    allow: [traefik]
  - name: external-dns
    defaultDeny: true
    allow: [monitoring]
  - name: external-secrets
  - name: falco
    defaultDeny: true
    allow: [monitoring]
  - name: gitea
    defaultDeny: true
    allow: [traefik, go-healthcheck, cnpg-system, monitoring]
  - name: go-healthcheck
