{{- range $ns := .Values.namespaces }}
{{- if $ns.observeDns }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: observe-dns
  namespace: {{ $ns.name }}
spec:
  endpointSelector: {}
  egress:
    # the dns rule selects the endpoint for egress policy, so everything
    # else must be explicitly permitted: observation must never restrict
    - toEntities: [all]
    - toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
{{- end }}
{{- end }}
