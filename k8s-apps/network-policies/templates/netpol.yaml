{{- range $ns := .Values.namespaces }}
{{- if or $ns.defaultDeny $ns.nodeProbes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: {{ $ns.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- range $caller := $ns.allow | default list }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $caller }}
{{- end }}
        - ipBlock:
            cidr: {{ $.Values.nodeCIDR }}
{{- if $ns.allowClusterIngress }}
        # all pods cluster-wide; ipBlock never matches pod traffic under cilium
        - podSelector: {}
          namespaceSelector: {}
{{- else if $ns.allowClusterIngressPorts }}
        # pods cluster-wide, port-scoped
        - podSelector: {}
          namespaceSelector: {}
          ports:
{{- range $p := $ns.allowClusterIngressPorts }}
            - port: {{ $p.port }}
{{- if $p.protocol }}
              protocol: {{ $p.protocol }}
{{- end }}
{{- end }}
{{- end }}
{{- if $ns.allowWorldIngress }}
        # world/LAN ingress (traefik frontdoor, tailscale wireguard); ipBlock
        # never matches pod traffic under cilium, so pod paths stay isolated
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ $.Values.podCIDR }}
{{- end }}
{{- if $ns.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $ns.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
{{- end }}
{{- end }}
