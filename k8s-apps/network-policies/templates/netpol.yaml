{{- range $ns := .Values.namespaces }}
{{- if or $ns.defaultDeny $ns.nodeProbes }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: {{ $ns.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- range $caller := $ns.allow | default list }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $caller }}
{{- end }}
        - ipBlock:
            cidr: {{ $.Values.nodeCIDR }}
{{- if $ns.allowClusterIngress }}
        - ipBlock:
            cidr: {{ $.Values.podCIDR }}
{{- end }}
{{- if $ns.defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $ns.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
{{- end }}
{{- end }}
