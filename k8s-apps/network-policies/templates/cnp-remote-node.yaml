{{- range $ns := .Values.namespaces }}
{{- if $ns.allowRemoteNode }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-remote-node-ingress
  namespace: {{ $ns.name }}
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - remote-node
{{- if $ns.remoteNodePorts }}
      toPorts:
{{- range $p := $ns.remoteNodePorts }}
        - ports:
            - port: "{{ $p.port }}"
              protocol: {{ $p.protocol }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
