# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - homelab2

  controllers:
    slskd:
      replicas: 0
      forceRename: slskd
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        slskd:
          image:
            repository: slskd/slskd
            tag: 0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
          env:
            TZ: Europe/Paris
            SLSKD_CONFIG: /config/slskd.yml
          envFrom:
            - secretRef:
                name: slskd-credentials
          args:
            - ./slskd
            - --upload-speed-limit=20480
            - --download-speed-limit=20480
          ports:
            - name: http
              containerPort: 5030
            - name: slskd
              containerPort: 51413
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

    beets:
      forceRename: beets
      type: cronjob
      cronjob:
        schedule: "*/5 * * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 3
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      containers:
        beets:
          image:
            repository: lscr.io/linuxserver/beets
            tag: 2.14.1-ls359
          command:
            - beet
          args:
            - import
            - /downloads
          env:
            TZ: Europe/Paris
            PUID: 1000
            PGID: 1000

    picard:
      replicas: 0
      forceRename: picard
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      containers:
        picard:
          image:
            repository: jlesage/musicbrainz-picard
            tag: v26.11.1@sha256:80f082c3631e68e9163b1ed658d2612e8ec8396bfed51090ed3967cad08e2964
          env:
            TZ: Europe/Paris
            DARK_MODE: "1"
            ENABLE_CJK_FONT: "1"
          ports:
            - name: http
              containerPort: 5800
          probes:
            liveness:
              enabled: false
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: false
              spec:
                httpGet:
                  port: http
                  path: /health

  service:
    slskd:
      forceRename: slskd
      controller: slskd
      type: ClusterIP
      ports:
        http:
          port: 5030
    picard:
      forceRename: picard
      controller: picard
      type: ClusterIP
      ports:
        http:
          port: 5800

  ingress:
    slskd:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host slskd.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: slskd
                port: http
      tls:
        - secretName: slskd-tls
          hosts:
            - *host

    picard:
      className: "tailscale"
      hosts:
        - host: &host picard.snow-delta.ts.net
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: picard
                port: http
      tls:
        - secretName: picard-tls
          hosts:
            - *host

  persistence:
    # Shared music volume: library/ for the collection, slskd/ for
    # download staging (slskd writes, beets consumes slskd/complete).
    music:
      enabled: true
      type: persistentVolumeClaim
      forceRename: music
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 100Gi
      advancedMounts:
        slskd:
          slskd:
            - path: /download/incomplete
              subPath: slskd/incomplete
            - path: /download/complete
              subPath: slskd/complete
            - path: /music
              subPath: library
        beets:
          beets:
            - path: /downloads
              subPath: slskd/complete
            - path: /music
              subPath: library
        picard:
          picard:
            - path: /storage
              subPath: library

    slskd-data:
      forceRename: slskd-data
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 500Mi
      advancedMounts:
        slskd:
          slskd:
            - path: /app

    beets-config:
      enabled: true
      type: persistentVolumeClaim
      forceRename: beets-config
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        beets:
          beets:
            - path: /config

    beets-configmap:
      type: configMap
      identifier: beets-configmap
      advancedMounts:
        beets:
          beets:
            - path: /config/config.yaml
              subPath: config.yaml

    picard-config:
      enabled: true
      type: persistentVolumeClaim
      forceRename: picard-config
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 100Mi
      advancedMounts:
        picard:
          picard:
            - path: /config

    slskd-config:
      type: configMap
      identifier: slskd-config
      advancedMounts:
        slskd:
          slskd:
            - path: /config
              readOnly: true

  configMaps:
    slskd-config:
      data:
        slskd.yml: |
          remote_file_management: true
          debug: false
          directories:
              incomplete: /download/incomplete
              downloads: /download/complete
          shares:
              directories:
              - /music
          soulseek:
              listen_port: 39332
          web:
              authentication:
                  disabled: true
    beets-configmap:
      includeChecksumInControllers:
        - beets
      data:
        config.yaml: |
          plugins: musicbrainz fetchart embedart convert scrub replaygain lastgenre chroma web
          directory: /music
          library: /config/musiclibrary.blb
          art_filename: albumart
          threaded: yes
          original_date: no
          per_disc_numbering: no

          convert:
              auto: no
              ffmpeg: /usr/bin/ffmpeg
              opts: -ab 320k -ac 2 -ar 48000
              max_bitrate: 320
              threads: 1

          paths:
              default: $albumartist/$album%if{$year, ($year)}/$track $title
              singleton: Non-Album/$artist - $title
              comp: Compilations/$album%aunique{}/$track $title
              albumtype_soundtrack: Soundtracks/$album/$track $title

          import:
              write: yes
              copy: yes
              move: no
              resume: ask
              incremental: yes
              quiet_fallback: skip
              timid: no
              log: /config/beet.log

          lastgenre:
              auto: yes
              source: album

          embedart:
              auto: yes

          fetchart:
              auto: yes

          replaygain:
              auto: no
              command: mp3gain

          scrub:
              auto: yes

          replace:
              '^\.': _
              '[\x00-\x1f]': _
              '[<>:"\?\*\|]': _
              '[\xE8-\xEB]': e
              '[\xEC-\xEF]': i
              '[\xE2-\xE6]': a
              '[\xF2-\xF6]': o
              '[\xF8]': o
              '\.$': _
              '\s+$': ''

          web:
              host: 0.0.0.0
              port: 8337
