kube-prometheus-stack:
  prometheus:
    annotations:
      reloader.stakater.com/auto: "false"

    # ref: https://github.com/prometheus-operator/prometheus-operator/blob/master/Documentation/api.md#prometheusspec
    prometheusSpec:
      # ref: https://github.com/prometheus-operator/prometheus-operator/blob/release-0.44/pkg/prometheus/promcfg.go#L180-L183
      scrapeInterval: 120s

      retention: 30d

      # Watch all PrometheusRules in the cluster.
      ruleNamespaceSelector:
        matchLabels: {}
      ruleSelector:
        matchLabels: {}

      # Watch all ServiceMonitors in the cluster.
      serviceMonitorNamespaceSelector:
        matchLabels: {}
      serviceMonitorSelector:
        matchLabels: {}

      # Watch all PodMonitors in the cluster.
      podMonitorSelector:
        matchLabels: {}
      podMonitorNamespaceSelector:
        matchLabels: {}

      resources:
        requests:
          cpu: 1000m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 2Gi

      # ref: https://github.com/prometheus-operator/prometheus-operator/blob/master/Documentation/user-guides/storage.md
      storageSpec:
        volumeClaimTemplate:
          metadata:
            annotations:
              helm.sh/resource-policy: keep
              argocd.argoproj.io/sync-options: Delete=false
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

      # Host-level exporters outside the cluster (NixOS machines).
      additionalScrapeConfigs:
        - job_name: smartctl-homelab3
          static_configs:
            - targets: ["192.168.1.141:9633"]

      thanos: {}
        # objectStorageConfig:
        #   key: objstore.yml
        #   name: thanos-objstore-secret

    service:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "prometheus"

    ingress:
      enabled: true
      ingressClassName: traefik

      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
      hosts:
        - prometheus.terence.cloud
      tls:
        - secretName: prometheus-general-tls
          hosts:
            - prometheus.terence.cloud

    thanosService:
      enabled: false

    thanosServiceMonitor:
      enabled: false

  # ==============================================================================
  # Grafana
  # Default values: https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
  # ==============================================================================

  grafana:
    annotations:
      reloader.stakater.com/auto: "false"

    defaultDashboardsTimezone: Europe/Paris

    # Required as long as Grafana's persistent volume is ReadWriteOnce.
    # During a rolling update, the new Grafana pod would not be able to start
    # while the old pod still holds the volume.
    deploymentStrategy:
      type: Recreate

    serviceMonitor:
      scrapeTimeout: 5s

    envFromSecret: pocket-id-credentials

    labels:
      sablier.enable: "false"
      sablier.group: "grafana"

    ingress:
      enabled: true
      ingressClassName: traefik

      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        cert-manager.io/issue-temporary-certificate: "true"
        external-dns.kubernetes.io/target: home.terence.cloud
        # traefik.ingress.kubernetes.io/router.middlewares: monitoring-sablier@kubernetescrd,traefik-modsecurity@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
      hosts:
        - grafana.terence.cloud
      tls:
        - secretName: grafana-general-tls
          hosts:
            - grafana.terence.cloud

    # The oAuth2 proxy handles authentication, not Grafana.
    grafana.ini:
      server:
        root_url: https://grafana.terence.cloud
      auth:
        disable_login_form: true
        signout_redirect_url: https://auth.terence.cloud/api/oidc/end-session
        oauth_allow_insecure_email_lookup: true
      auth.basic:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        auto_login: true
        allow_sign_up: true
        scopes: openid email profile
        auth_url: https://auth.terence.cloud/authorize
        token_url: https://auth.terence.cloud/api/oidc/token
        api_url: https://auth.terence.cloud/api/oidc/userinfo
        client_id: 1eded5c9-3543-4344-bd35-67a741fc0d8a
      users:
        allow_sign_up: false
        auto_assign_org: true
        auto_assign_org_role: Admin

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    livenessProbe:
      initialDelaySeconds: 30

    # Organise dashboards by provider, with the provider's name as the key.
    dashboards:
      default:
        # The "default" provider is defined below.
        cloudnativepg:
          gnetId: 20417
          datasource: Prometheus
      extra: {}
        # pihole-overview:
        #   gnetId: 10176
        #   datasource: Prometheus
        # argocd-overview:
        #   gnetId: 14584
        #   datasource: Prometheus
        # cert-manager-overview:
        #   gnetId: 11001
        #   datasource: Prometheus
        # external-dns-overview:
        #   gnetId: 15038
        #   datasource: Prometheus
        # blackbox-exporter-overview:
        #   gnetId: 5345
        #   datasource: Prometheus
        # thanos-overview:
        #   gnetId: 12937
        #   datasource: Thanos

    # Configure dashboard providers.
    # ref: http://docs.grafana.org/administration/provisioning/#dashboards
    # `path` must be /var/lib/grafana/dashboards/<provider_name>
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: "extra"
            orgId: 1
            folder: "Extra"
            type: file
            disableDeletion: true
            editable: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/extra
          - name: gitops
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/gitops

    # Dashboards generated by workbench/grafana-dashboards are packaged into
    # this ConfigMap by templates/grafana-gitops-dashboards.yaml.
    extraConfigmapMounts:
      - name: grafana-gitops-dashboards
        mountPath: /var/lib/grafana/dashboards/gitops
        configMap: grafana-gitops-dashboards
        readOnly: true

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      finalizers:
        - kubernetes.io/pvc-protection
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://kube-prometheus-stack-prometheus:9090
            access: proxy
          - name: Loki
            type: loki
            url: http://loki-gateway.loki
            access: proxy

    plugins:
      - grafana-piechart-panel
  # ==============================================================================
  # Alertmanager
  # ref: https://prometheus.io/docs/alerting/alertmanager/
  # ==============================================================================

  alertmanager:
    enabled: true
    alertmanagerSpec:
      # useExistingSecret: true
      secrets:
        - telegram-bot-token
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

    config:
      receivers:
        - name: empty
        - name: telegram
          telegram_configs:
            - send_resolved: true
              bot_token_file: /etc/alertmanager/secrets/telegram-bot-token/token
              chat_id_file: /etc/alertmanager/secrets/telegram-bot-token/chat-id
              parse_mode: HTML
              message: |
                {{ if eq .Status "firing" }}<b>🔥 FIRING: {{ .Alerts.Firing | len }}</b>{{ else }}<b>✅ RESOLVED: {{ .Alerts.Resolved | len }}</b>{{ end }}

                {{ range .Alerts -}}
                <b>Alert:</b> {{ .Labels.alertname }}
                <b>Severity:</b> {{ .Labels.severity }}
                {{ if .Annotations.summary }}<b>Summary:</b> {{ .Annotations.summary }}{{ end }}
                {{ if .Annotations.description }}<b>Description:</b> <i>{{ .Annotations.description }}</i>{{ end }}

                <b>Labels:</b>
                {{ range .Labels.SortedPairs -}}
                  {{ if (eq .Name "alertname" "severity" "prometheus" "instance") | not -}}
                  • <code>{{ .Name }}</code>: {{ .Value }}
                  {{ end -}}
                {{- end }}
                {{ end }}
                <a href="{{ .ExternalURL }}">View in Alertmanager</a>
        - name: agent-relay
          webhook_configs:
            - url: http://agent-relay.agent-relay:8080/alerts
              send_resolved: false
      inhibit_rules:
        - source_matchers:
            - alertname="JellyfinSocketSpam"
          target_matchers:
            - alertname="TraefikHigh5xxRate"
          equal: ["service", "context"]
      route:
        group_by: ["alertname"]
        group_wait: 0s
        receiver: telegram
        routes:
          - matchers:
              - alertname=~"CNPGClusterHA.*|CNPGClusterLowDiskSpace.*|KubeCPUOvercommit|KubeMemoryOvercommit|Watchdog|InfoInhibitor|JellyfinSocketSpam"
            receiver: empty
          # Warning/critical alerts trigger both the agent investigation (via
          # the relay) and the raw Telegram notification. continue lets them
          # fall through to the telegram route below; other severities only
          # hit the parent telegram receiver.
          - matchers:
              - severity=~"warning|critical"
            receiver: agent-relay
            continue: true
          - matchers:
              - severity=~"warning|critical"
            receiver: telegram

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
      hosts:
        - alertmanager.terence.cloud
      paths:
        - /
      pathType: ImplementationSpecific
      tls:
        - secretName: alertmanager-tls
          hosts:
            - alertmanager.terence.cloud

  kubeControllerManager:
    enabled: false

  # Host-level SMART alerts, fed by the smartctl exporter on homelab3
  # (scraped via additionalScrapeConfigs).
  additionalPrometheusRulesMap:
    smartctl:
      groups:
        - name: smartctl
          rules:
            - alert: SmartDeviceFailing
              expr: smartctl_device_smart_status == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "SMART failing on {{ $labels.device }} ({{ $labels.hostname }})"
                description: >-
                  SMART overall health status is FAILED on device {{ $labels.device }}.
                  Back up and replace the disk.
            - alert: SmartDeviceHighTemperature
              expr: smartctl_device_temperature{temperature_type="current"} > 60
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "High temperature on {{ $labels.device }} ({{ $labels.hostname }})"
                description: >-
                  Disk temperature is {{ $value }}C, above 60C for 10 minutes.
            - alert: SmartReallocatedSectors
              expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Reallocated sectors on {{ $labels.device }} ({{ $labels.hostname }})"
                description: >-
                  {{ $value }} reallocated sectors. The disk has remapped bad
                  sectors; watch it and plan replacement.
            - alert: SmartPendingSectors
              expr: smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Pending sectors on {{ $labels.device }} ({{ $labels.hostname }})"
                description: >-
                  {{ $value }} sectors are waiting to be remapped. Often a
                  precursor to reallocated sectors.
            - alert: SmartctlExporterDown
              expr: absent(smartctl_device_smart_status)
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: smartctl exporter on homelab3 unreachable
                description: >-
                  No smartctl metrics scraped from homelab3 for 10 minutes.
                  The exporter or the host may be down.

    pv-hygiene:
      groups:
        - name: pv-hygiene
          rules:
            - alert: PersistentVolumeReleased
              expr: kube_persistentvolume_status_phase{phase="Released"} == 1
              for: 15m
              labels:
                severity: info
              annotations:
                summary: "PersistentVolume {{ $labels.persistentvolume }} is Released"
                description: >-
                  PV {{ $labels.persistentvolume }} has been Released for 15
                  minutes: its claim was deleted but the volume and its data
                  are retained. Clean up the data on the node, then delete the
                  PV.

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

grafana-mcp-server:
  global:
    fullnameOverride: grafana-mcp-server
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: grafana/mcp-grafana
            tag: 2.1.1@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
          args:
            - --allowed-hosts=*
            - -t=streamable-http
          env:
            TZ: Europe/Paris
            GRAFANA_URL: http://kube-prometheus-stack-grafana
            GRAFANA_SERVICE_ACCOUNT_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-credentials
                  key: sa-token
          ports:
            - name: http
              containerPort: 8000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /healthz
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /healthz

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8000
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: grafana-mcp

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.middlewares: "monitoring-grafana-mcp-auth@kubernetescrd"
      className: "traefik"
      hosts:
        - host: &host gmcp.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: gmcp-tls
          hosts:
            - *host

  rawResources:
    grafana-mcp-credentials:
      enabled: true
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: openbao-secret-store
          target:
            name: grafana-mcp-credentials
            creationPolicy: Owner
          dataFrom:
            - extract:
                key: monitoring/grafana-mcp-credentials
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
                nullBytePolicy: Ignore
    grafana-mcp-auth-middleware:
      enabled: true
      forceRename: grafana-mcp-auth
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          basicAuth:
            secret: grafana-mcp-auth
    mcp-auth-secret:
      enabled: true
      forceRename: grafana-mcp-auth
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          refreshInterval: "0"
          target:
            name: grafana-mcp-auth
            creationPolicy: Owner
            template:
              type: kubernetes.io/basic-auth
              engineVersion: v2
              data:
                username: "mcp"
                password: '{{ printf "{{ .password }}" }}'
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: short-password
    telegram-bot-token:
      enabled: true
      forceRename: telegram-bot-token
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: openbao-secret-store
          target:
            name: telegram-bot-token
            creationPolicy: Owner
          dataFrom:
            - extract:
                key: monitoring/telegram-bot-token
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
                nullBytePolicy: Ignore
    pocket-id-credentials:
      enabled: true
      forceRename: pocket-id-credentials
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: openbao-secret-store
          target:
            name: pocket-id-credentials
            creationPolicy: Owner
          dataFrom:
            - extract:
                key: monitoring/pocket-id-credentials
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
                nullBytePolicy: Ignore
    sablier:
      enabled: true
      forceRename: sablier
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: grafana
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: grafana
