# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"

      containers:
        main:
          image:
            repository: registry.terence.cloud/mcp-telegram
            tag: v5
            pullPolicy: IfNotPresent
          env:
            TZ: Europe/Paris
          envFrom:
            - secretRef:
                name: credentials
          ports:
            - name: http
              containerPort: 8000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8000
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: telegram-mcp

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.middlewares: "mcp-telegram-mcp-auth@kubernetescrd"
      className: "traefik"
      hosts:
        - host: &host tmcp.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: tmcp-tls
          hosts:
            - *host

  rawResources:
    credentials:
      enabled: true
      forceRename: "credentials"
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: openbao-secret-store
          target:
            name: "credentials"
            creationPolicy: Owner
          dataFrom:
            - extract:
                key: mcp-telegram/credentials
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
                nullBytePolicy: Ignore
    mcp-auth-middleware:
      enabled: true
      forceRename: mcp-auth
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          basicAuth:
            secret: mcp-telegram-auth
    mcp-auth-secret:
      enabled: true
      forceRename: mcp-telegram-auth
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          refreshInterval: "0"
          target:
            name: mcp-telegram-auth
            creationPolicy: Owner
            template:
              type: kubernetes.io/basic-auth
              engineVersion: v2
              data:
                username: "mcp"
                password: '{{ printf "{{ .password }}" }}'
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: short-password
