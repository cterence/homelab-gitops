# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      # One writer: the background poller and the web server share the SQLite file.
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        # The entrypoint chowns the data directories and drops to www-data.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      containers:
        main:
          image:
            repository: ghcr.io/themartz90/jellydash
            tag: 1.18.1@sha256:bbd352713755722a9a0c58aeaff32358ae11fb34376cd373372a22e96bed7547
          envFrom:
            - secretRef:
                name: jellydash-jf-api-token
          env:
            TZ: Europe/Paris
            APP_TIMEZONE: Europe/Paris
            DB_DRIVER: sqlite3
            DB_NAME: /var/www/html/var/data/jellydash.sqlite
            JELLYFIN_URL: http://jellyfin.jellyfin:8096
            APP_URL: https://jellydash.snow-delta.ts.net
          ports:
            - name: http
              containerPort: 80
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /healthz.php
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /healthz.php

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 80

  ingress:
    main:
      className: "tailscale"
      hosts:
        - host: &host jellydash.snow-delta.ts.net
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: jellydash-tls
          hosts:
            - *host

  persistence:
    # Database, pending history samples, logs and sessions.
    var:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /var/www/html/var
    # Saved posters and uploaded images.
    uploads:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /var/www/html/public/uploads
    # Compiled templates are cleared on every start.
    cache:
      enabled: true
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /var/www/html/cache
