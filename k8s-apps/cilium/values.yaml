cilium:
  MTU: 1500
  routingMode: "native"
  autoDirectNodeRoutes: true
  ipv4NativeRoutingCIDR: "10.244.0.0/16"
  ipam:
    mode: cluster-pool
    operator:
      clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]
  cni:
    customConf: false
  kubeProxyReplacement: "false"
  policyEnforcementMode: default
  bpf:
    masquerade: true
  hostFirewall:
    enabled: false
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
    eventBuffer:
      size: 65535
    metrics:
      enabled:
        - drop
        - flow
        - tcp
        - dns
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
  operator:
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
