# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"

  configMaps:
    versity:
      data:
        VGW_HEALTH: /health
        VGW_REGION: us-east-1

  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/versity/versitygw
            tag: v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          args:
            - posix
            - /buckets
            - --chuid
            - --chgid
          env:
            TZ: Europe/Paris
          envFrom:
            - configMapRef:
                identifier: versity
            - secretRef:
                name: versity-gw-credentials
          ports:
            - name: http
              containerPort: 7070
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

    webdav:
      type: deployment
      strategy: Recreate
      labels:
        sablier.enable: "true"
        sablier.group: "{{ .Release.Name }}"
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      containers:
        webdav:
          image:
            repository: registry.terence.cloud/apachewebdav
            tag: v2
            pullPolicy: IfNotPresent
          env:
            TZ: Europe/Paris
            PUID: "1000"
            PGID: "1000"
            USERNAME: kindle
            NO_CHOWN_DATA: "true"
            PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-webdav-password"
                  key: password
          ports:
            - name: http
              containerPort: 80
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

    nfs:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        velero.io/exclude-from-backup: "true"
      pod:
        labels:
          velero.io/exclude-from-backup: "true"
      containers:
        main:
          image:
            repository: ghcr.io/versity/versitygw
            tag: v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          args:
            - posix
            - --sidecar
            - /tmp/sidecar
            - /buckets
          env:
            TZ: Europe/Paris
          envFrom:
            - configMapRef:
                identifier: versity
            - secretRef:
                name: versity-gw-credentials
          ports:
            - name: http
              containerPort: 7070
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

    storage-pool:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        velero.io/exclude-from-backup: "true"
      pod:
        labels:
          velero.io/exclude-from-backup: "true"
      containers:
        main:
          image:
            repository: ghcr.io/versity/versitygw
            tag: v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
          args:
            - posix
            - /buckets
            - --chuid
            - --chgid
          env:
            TZ: Europe/Paris
          envFrom:
            - configMapRef:
                identifier: versity
            - secretRef:
                name: versity-gw-credentials
          ports:
            - name: http
              containerPort: 7070
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 7070
    nfs:
      controller: nfs
      type: ClusterIP
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "versity-gw-nfs"
      ports:
        http:
          port: 7070
    storage-pool:
      controller: storage-pool
      type: ClusterIP
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "versity-gw-storage-pool"
      ports:
        http:
          port: 7070
    webdav:
      controller: webdav
      type: ClusterIP
      ports:
        http:
          port: 80

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/target: home.terence.cloud
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host versity.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: versity-tls
          hosts:
            - *host
    webdav:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/target: home.terence.cloud
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-strip-first-path@kubernetescrd,traefik-modsecurity@kubernetescrd,{{ .Release.Namespace }}-sablier@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host versity.terence.cloud
          paths:
            - path: /webdav
              pathType: Prefix
              service:
                identifier: webdav
                port: http
      tls:
        - secretName: versity-tls
          hosts:
            - *host

  persistence:
    buckets:
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 2Gi
      advancedMounts:
        main:
          main:
            - path: /buckets
        webdav:
          webdav:
            - path: /var/lib/dav/data
              subPath: obsidian/Kindle

    storage-pool:
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      labels:
        velero.io/exclude-from-backup: "true"
      storageClass: local-path-storage-pool
      accessMode: ReadWriteOnce
      size: 1000Gi
      advancedMounts:
        storage-pool:
          main:
            - path: /buckets

    nfs:
      type: persistentVolumeClaim
      existingClaim: mx500-homelab3
      advancedMounts:
        nfs:
          main:
            - path: /buckets
              subPath: versity-gw

    nfs-xattrs:
      enabled: true
      type: emptyDir
      advancedMounts:
        nfs:
          main:
            - path: /tmp/sidecar

  rawResources:
    sablier:
      enabled: true
      forceRename: sablier
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: "{{ .Release.Name }}"
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: "{{ .Release.Name }}"
    versity-gw-credentials:
      enabled: true
      forceRename: versity-gw-credentials
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: openbao-secret-store
          target:
            name: versity-gw-credentials
            creationPolicy: Owner
          dataFrom:
            - extract:
                key: versity-gw/versity-gw-credentials
    webdav-password:
      enabled: true
      forceRename: "{{ .Release.Name }}-webdav-password"
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: "{{ .Release.Name }}-webdav-password"
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: short-password
    nfs-pv:
      enabled: true
      forceRename: mx500-homelab3
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 2Ti
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: nfs
          mountOptions:
            - hard
            - nfsvers=4.1
            - nosuid
            - noexec
            - timeo=600
            - retrans=2
          nfs:
            path: /mx500-homelab3
            server: 192.168.1.141
    nfs-pvc:
      enabled: true
      forceRename: mx500-homelab3
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Ti
          storageClassName: nfs
          volumeName: mx500-homelab3
