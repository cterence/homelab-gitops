# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/tailscale/golink
            tag: main@sha256:649b75499aa571a437ded863ccda149e66f59b10714e8c9ce59a82b01b4ca407
          # dev mode: plain listener, no tsnet. The tailscale-operator proxy
          # in front of the Service owns the tailnet identity and TLS.
          args:
            - -dev-listen=:8080
            - -sqlitedb=/home/nonroot/golink.db
          env:
            TZ: Europe/Paris
          ports:
            - name: http
              containerPort: 8080
          probes:
            liveness:
              enabled: true
              type: HTTP
            readiness:
              enabled: true
              type: HTTP

  service:
    main:
      controller: main
      type: ClusterIP
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: go
      ports:
        http:
          port: 80
          targetPort: http

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      globalMounts:
        - path: /home/nonroot
