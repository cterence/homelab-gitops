niks3:
  image:
    repository: ghcr.io/mic92/niks3
    tag: v1.14.2@sha256:d4c3ca5d6aa4e3b741408e0644c6220c78bf442ad74aca17ed3bdc6354d9d5c8
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  extraEnv:
    - name: TZ
      value: Europe/Paris

  database:
    existingSecret: niks3-cnpg-cluster-app
    secretKey: fqdn-uri

  s3:
    endpoint: versity.terence.cloud
    bucket: nix-cache
    region: us-east-1
    useSSL: true
    existingSecret: versity-credentials

  auth:
    existingSecret: api-token
    oidcProviders:
      github:
        issuer: https://token.actions.githubusercontent.com
        audience: https://niks3.terence.cloud
        bound_claims:
          repository_owner: ["cterence"]
        bound_subject:
          - "repo:cterence/nixos-config:*"
          - "repo:cterence/clowder:*"
          - "repo:cterence@25285508/nixos-config@1175564420:*"
          - "repo:cterence@25285508/clowder@1388222425:*"

  signing:
    existingSecret: signing-key
    keys: [signing-key]

  cacheURL: https://niks3.terence.cloud
  readProxy:
    enabled: true

  gc:
    schedule: "0 0 * * *"
    olderThan: 168h

  service:
    port: 5751

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.kubernetes.io/target: home.terence.cloud
      external-dns.kubernetes.io/cloudflare-proxied: "false"
    hosts:
      - host: niks3.terence.cloud
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: niks3-tls
        hosts: [niks3.terence.cloud]

  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s

  grafanaDashboard:
    enabled: true

cnpg-cluster:
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 1
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql
    storage:
      size: 5Gi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    logLevel: "info"
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
      prometheusRule:
        excludeRules:
          - CNPGClusterLogicalReplicationErrorsCritical
          - CNPGClusterLogicalReplicationErrors
          - CNPGClusterLogicalReplicationStoppedCritical
          - CNPGClusterLogicalReplicationStopped
          - CNPGClusterHACritical
          - CNPGClusterHAWarning
    postgresql: {}
    initdb:
      database: niks3
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: http://versity-gw-storage-pool.versity-gw:7070
    destinationPath: s3://cnpg-backups/niks3
    provider: s3
    s3:
      region: us-east-1
      bucket: cnpg-backups
      path: /niks3
    secret:
      create: false
      name: cnpg-backup-s3-creds
    wal:
      compression: gzip
      encryption: ""
      maxParallel: 1
    data:
      compression: gzip
      encryption: ""
      jobs: 2
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 1 * * *"
        backupOwnerReference: self
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
    retentionPolicy: "7d"
