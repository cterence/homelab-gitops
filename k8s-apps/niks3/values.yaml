niks3:
  image:
    repository: ghcr.io/mic92/niks3
    tag: v1.17.1@sha256:8c78347d3ed0abab966ebb295769b954caa36f75037ef88c07752d6936c42425
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  extraEnv:
    - name: TZ
      value: Europe/Paris

  database:
    existingSecret: niks3-cnpg-cluster-app
    secretKey: fqdn-uri

  s3:
    endpoint: garage-ssd.garage-ssd:3900
    publicURL: http://garage-ssd.snow-delta.ts.net:3900
    bucket: niks3
    region: us-east-1
    useSSL: false
    existingSecret: s3-credentials

  auth:
    existingSecret: api-token
    oidcProviders:
      github:
        issuer: https://token.actions.githubusercontent.com
        audience: http://niks3.snow-delta.ts.net:5751
        bound_claims:
          repository_owner: ["cterence"]
        # The slug entry covers the repo by name; the ID entry survives
        # renames and forks. Get them with:
        #   gh api repos/<owner>/<repo> -q '.id + " " + .owner.id'
        # prints "<repo-id> <owner-id>", used in the ID-form entries.
        bound_subject:
          - "repo:cterence/nixos-config:*"
          - "repo:cterence/homelab-gitops:*"
          - "repo:cterence@25285508/nixos-config@1175564420:*"
          - "repo:cterence@25285508/homelab-gitops@458852372:*"

  signing:
    existingSecret: signing-key
    keys: [signing-key]

  cacheURL: https://niks3.terence.cloud
  readProxy:
    enabled: true

  gc:
    schedule: "0 0 * * *"
    olderThan: 168h

  service:
    port: 5751

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.kubernetes.io/target: home.terence.cloud
      external-dns.kubernetes.io/cloudflare-proxied: "false"
    hosts:
      - host: niks3.terence.cloud
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: niks3-tls
        hosts: [niks3.terence.cloud]

  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s

  grafanaDashboard:
    enabled: true

cnpg-cluster:
  type: postgresql
  mode: standalone
  version:
    postgresql: "18"
  cluster:
    instances: 1
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql
    storage:
      size: 5Gi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    logLevel: "info"
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
      prometheusRule:
        excludeRules:
          - CNPGClusterLogicalReplicationErrorsCritical
          - CNPGClusterLogicalReplicationErrors
          - CNPGClusterLogicalReplicationStoppedCritical
          - CNPGClusterLogicalReplicationStopped
          - CNPGClusterHACritical
          - CNPGClusterHAWarning
    postgresql: {}
    initdb:
      database: niks3
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: http://garage.garage:3900
    destinationPath: s3://cnpg-backups/niks3
    provider: s3
    s3:
      region: us-east-1
      bucket: cnpg-backups
      path: /niks3
    secret:
      create: false
      name: cnpg-backup-s3-creds
    wal:
      compression: gzip
      encryption: ""
      maxParallel: 1
    data:
      compression: gzip
      encryption: ""
      jobs: 2
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 1 * * *"
        backupOwnerReference: self
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
    retentionPolicy: "7d"
