# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 0
      runAsGroup: 0

  controllers:
    tubearchivist:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        annotations:
          backup.velero.io/backup-volumes-excludes: storage-pool
      containers:
        tubearchivist:
          image:
            repository: bbilly1/tubearchivist
            tag: v0.5.12@sha256:ba1c846ddd0c6fdd0f040727129d2466e03b7a0c26499223839d450c7586ac09
          env:
            TZ: Europe/Paris
            ES_URL: http://tubearchivist-elasticsearch:9200
            REDIS_CON: redis://tubearchivist-valkey:6379
            TA_HOST: https://ta.terence.cloud
            TA_USERNAME: terence
            HOST_UID: "1000"
            HOST_GID: "1000"
            TA_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: tubearchivist-ta-password
                  key: password
            ELASTIC_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: tubearchivist-elastic-password
                  key: password
          ports:
            - name: http
              containerPort: 8000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /api/health/
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /api/health/

    valkey:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        valkey:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
            pullPolicy: IfNotPresent
          ports:
            - name: valkey
              containerPort: 6379
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: valkey
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: valkey

    elasticsearch:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        elasticsearch:
          image:
            repository: bbilly1/tubearchivist-es
            tag: 8.19.0@sha256:9da63fb1973ec3d57daf6916be948eddd0d8a404cc8e447c938480c85fe2c554
          env:
            TZ: Europe/Paris
            ES_JAVA_OPTS: -Xms512m -Xmx1g
            xpack.security.enabled: "true"
            discovery.type: single-node
            path.repo: /usr/share/elasticsearch/data/snapshot
            ELASTIC_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: tubearchivist-elastic-password
                  key: password
          ports:
            - name: http
              containerPort: 9200
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http

  service:
    tubearchivist:
      controller: tubearchivist
      type: ClusterIP
      ports:
        http:
          port: 8000
    valkey:
      controller: valkey
      type: ClusterIP
      ports:
        valkey:
          port: 6379
    elasticsearch:
      controller: elasticsearch
      type: ClusterIP
      ports:
        http:
          port: 9200

  ingress:
    tubearchivist:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host ta.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: tubearchivist
                port: http
      tls:
        - secretName: tubearchivist-tls
          hosts:
            - *host

  persistence:
    storage-pool:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: storage-pool
      advancedMounts:
        tubearchivist:
          tubearchivist:
            - path: /youtube
              subPath: tubearchivist/media
            - path: /cache
              subPath: tubearchivist/cache
    valkey-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        valkey:
          valkey:
            - path: /data
    elasticsearch-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        elasticsearch:
          elasticsearch:
            - path: /usr/share/elasticsearch/data

  rawResources:
    ta-password:
      enabled: true
      forceRename: tubearchivist-ta-password
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: tubearchivist-ta-password
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password
    elastic-password:
      enabled: true
      forceRename: tubearchivist-elastic-password
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: tubearchivist-elastic-password
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password
