garage:
  garage:
    singleNode: true
    s3:
      api:
        region: us-east-1
    existingRpcSecret: garage-rpc-secret
    # consistent LMDB copies in /mnt/meta/snapshots (2 kept), so velero kopia
    # backup of the meta PVC has a non-torn copy to restore
    metadataAutoSnapshotInterval: "2h"

  service:
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: garage-ssd
      tailscale.com/tags: "tag:garage"

  image:
    repository: dxflrs/amd64_garage
    tag: v2.6.0@sha256:353a3f29291482faa51ef34de76508e0df448d37842eeeef5f0b69a5f9274eb3

  initImage:
    repository: busybox
    tag: stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

  persistence:
    enabled: true
    data:
      size: 1000Gi

  ingress:
    s3:
      api:
        enabled: false
      web:
        enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /health
      port: 3903
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 3903
    periodSeconds: 15

  monitoring:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
