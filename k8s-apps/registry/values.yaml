# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: registry
            tag: "3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3"
          env:
            REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
            REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
            REGISTRY_LOG_LEVEL: "info"
            REGISTRY_STORAGE_DELETE_ENABLED: "true"
            REGISTRY_AUTH: htpasswd
            REGISTRY_AUTH_HTPASSWD_REALM: basic-realm
            REGISTRY_AUTH_HTPASSWD_PATH: /etc/docker/registry/auth/htpasswd
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 5000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 10
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 5
                periodSeconds: 10

    garbage-collect:
      type: cronjob
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
      cronjob:
        schedule: "0 4 * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 1
        backoffLimit: 1
        ttlSecondsAfterFinished: 86400
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroupChangePolicy: OnRootMismatch
      containers:
        gc:
          image:
            repository: registry
            tag: "3.1.2@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3"
          args:
            - garbage-collect
            - --delete-untagged
            - /etc/docker/registry/config.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

  configMaps:
    gc-config:
      enabled: true
      forceRename: gc-config
      data:
        config.yml: |
          version: 0.1
          storage:
            filesystem:
              rootdirectory: /var/lib/registry
            delete:
              enabled: true

  rawResources:
    # Lets the registry-pull-secret ClusterExternalSecret (external-secrets
    # app) read the terraform-managed registry-auth secret in this namespace.
    k8s-registry:
      enabled: true
      forceRename: k8s-registry
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: k8s-registry
          annotations:
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        spec:
          provider:
            kubernetes:
              remoteNamespace: registry
              server:
                url: "https://kubernetes.default"
                caProvider:
                  type: ConfigMap
                  name: kube-root-ca.crt
                  namespace: external-secrets
                  key: ca.crt
              auth:
                serviceAccount:
                  name: "k8s-secret-store"
                  namespace: external-secrets

  service:
    main:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: registry
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 5000

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.middlewares: traefik-ip-allowlist@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host registry.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: registry-tls
          hosts:
            - *host

  persistence:
    # terraform-managed secret (htpasswd + password keys); on rotation
    # regenerate the bcrypt htpasswd alongside the password
    auth:
      type: secret
      name: registry-auth
      globalMounts:
        - path: /etc/docker/registry/auth
          readOnly: true
    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 20Gi
      globalMounts:
        - path: /var/lib/registry
    gc-config:
      type: configMap
      name: gc-config
      globalMounts:
        - path: /etc/docker/registry
          readOnly: true
