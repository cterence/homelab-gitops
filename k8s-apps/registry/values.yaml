# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: registry
            tag: "3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33"
          env:
            REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
            REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
            REGISTRY_LOG_LEVEL: "info"
            REGISTRY_STORAGE_DELETE_ENABLED: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - name: http
              containerPort: 5000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 10
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 5
                periodSeconds: 10

    garbage-collect:
      type: cronjob
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
      cronjob:
        schedule: "0 4 * * *"
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 1
        backoffLimit: 1
        ttlSecondsAfterFinished: 86400
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroupChangePolicy: OnRootMismatch
      containers:
        gc:
          image:
            repository: registry
            tag: "3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33"
          args:
            - garbage-collect
            - --delete-untagged
            - /etc/docker/registry/config.yml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

  configMaps:
    gc-config:
      enabled: true
      forceRename: gc-config
      data:
        config.yml: |
          version: 0.1
          storage:
            filesystem:
              rootdirectory: /var/lib/registry
            delete:
              enabled: true

  service:
    main:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: registry
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 5000

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.middlewares: traefik-ip-allowlist@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host registry.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: registry-tls
          hosts:
            - *host

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 20Gi
      globalMounts:
        - path: /var/lib/registry
    gc-config:
      type: configMap
      name: gc-config
      globalMounts:
        - path: /etc/docker/registry
          readOnly: true
