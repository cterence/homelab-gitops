---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-jail-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
data:
  .traefik.yml: |
    displayName: Traefik Jail
    type: middleware
    import: github.com/cterence/homelab-gitops/workbench/traefikjail
    summary: "Jails IPs that generate repeated 4xx errors with exponential backoff"
    testData:
      threshold: 30
      window: 120
      baseBan: 60
      maxBan: 3600
      resetAfter: 3600
      allowList:
        - 10.0.0.0/8
  patterns.txt: |
    # Regex patterns, one per line, matched against the request path.
    # A match counts patternWeight errors toward the jail threshold,
    # regardless of the response status code.
    # Regenerate the fail2ban-derived section with
    # scripts/extract-jail-patterns.sh and review the diff.
    (?i)^/\.env
    (?i)^/api/\.env
    (?i)^/\.ssh/
    (?i)^/\.git/
    (?i)^/\.svn/
    (?i)^/\.aws/
    (?i)^/\.bash_history
    (?i)^/\.npmrc
    (?i)^/\.vscode/sftp\.json
    (?i)^/_vti_pvt/
    (?i)^/wp-config\.php
    (?i)^/wp-admin/setup-config\.php
    (?i)^/phpinfo\.php
    (?i)/(wordpress|wp|blog)/wp/v2/users
    (?i)^/(backup|dump|database|database_backup)\.sql
    (?i)\.sql$
    (?i)^/secrets?\.json
    (?i)^/server\.key
    (?i)^/docker-compose\.yml
    (?i)^/(firebase-key|firebase-adminsdk|keyfile|key|google-key)\.json
    (?i)^/\.config/gcloud/
    (?i)^/dbadmin/
    (?i)^/storage/logs/laravel\.log
    (?i)^/user_secrets\.yml
    (?i)^/zzcanary-

    # --- fail2ban-derived: https://github.com/fail2ban/fail2ban
    # --- pinned to 7212404e8f937762a80325ba28b402a1f55535b0, from config/filter.d/botsearch-common.conf
    # --- regenerate with scripts/extract-jail-patterns.sh and review the diff
    (?i)^/roundcube(?:/|[-._0-9]|$)
    (?i)^/(ext)?mail(?:/|[-._0-9]|$)
    (?i)^/horde(?:/|[-._0-9]|$)
    (?i)^/(v-?)?webmail(?:/|[-._0-9]|$)
    (?i)^/(typo3/|xampp/|admin/|)(pma|(php)?[Mm]y[Aa]dmin)(?:/|[-._0-9]|$)
    (?i)^/wp-(login|signup|admin)\.php(?:/|[-._0-9]|$)
    (?i)^/cgi-bin(?:/|[-._0-9]|$)
    (?i)^/mysqladmin(?:/|[-._0-9]|$)
  go.mod: |
    {{- .Files.Get "traefik-jail/go.mod" | nindent 4 }}
  jail.go: |
    {{- .Files.Get "traefik-jail/jail.go" | nindent 4 }}
  plugin.go: |
    {{- .Files.Get "traefik-jail/plugin.go" | nindent 4 }}
