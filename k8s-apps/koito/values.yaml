# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: gabehf/koito
            tag: v0.3.2@sha256:3011de405ba2a5c56270928c2b0391add8aa3b3ed68363531b3c64b61f238857
          env:
            TZ: Europe/Paris
            KOITO_DEFAULT_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-admin-password"
                  key: password
          ports:
            - name: http
              containerPort: 4110
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /
            readiness:
              enabled: true
              type: HTTP
              path: /

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 4110

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
      className: "traefik"
      hosts:
        - host: &host koito.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: koito-tls
          hosts:
            - *host

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      globalMounts:
        - path: /etc/koito

  rawResources:
    admin-password:
      enabled: true
      forceRename: "{{ .Release.Name }}-admin-password"
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: "{{ .Release.Name }}-admin-password"
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password

dump:
  enabled: true
  databases:
    - /src/koito.db
  persistence:
    config:
      existingClaim: koito
