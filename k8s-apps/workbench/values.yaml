# Per-build values (provided by each subdir's build.yaml via ApplicationSet
# valueFiles, and subPath via ApplicationSet parameters).
image: "" # required: repo path in the registry, e.g. "my-app"
tag: "" # required: image tag, e.g. "1"; bump to trigger rebuild
dockerfile: Dockerfile
buildArgs: {} # optional map of build-arg name -> value

# Injected by the ApplicationSet as a Helm parameter.
subPath: "" # required: path within the repo, e.g. "workbench/my-app"

# Infra defaults (rarely overridden per build).
registry: registry.registry:5000
repoURL: github.com/cterence/homelab-gitops
branch: main
kanikoImage: ghcr.io/osscontainertools/kaniko:v1.28.6@sha256:2fa20b0a4b40c7db72b479d57e55c2cf79f2178533b2d3bcbd129d6bd3c087ed
backoffLimit: 2
# No ttlSecondsAfterFinished: keeping completed Jobs is what stops ArgoCD's
# selfHeal from recreating (and re-running Kaniko for) an already-built tag.

# Kaniko container resources (overridable per build).
resources:
  requests:
    cpu: 250m
    memory: 4Gi
  limits:
    memory: 4Gi
