falco:
  image:
    tag: latest
  falco:
    webserver:
      prometheus_metrics_enabled: true
  resources:
    limits:
      memory: 2Gi
  driver:
    kind: modern_ebpf
  tty: true
  collectors:
    kubernetes:
      enabled: true
  metrics:
    enabled: true
  serviceMonitor:
    create: true
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          folder: Falco
  falcosidekick:
    enabled: true
    replicaCount: 1
    serviceMonitor:
      enabled: true
    prometheusRules:
      enabled: true
    # The falco chart already provisions the Falco Grafana dashboard
    # (ConfigMap key falco-dashboard.json, folder Falco). Enabling it
    # here too creates a second ConfigMap with the same key/folder, which
    # makes Grafana's file provider fail with "unexpected number of
    # dashboards for id ... found: 2. desired: 1" every sync.
    grafana:
      dashboards:
        enabled: false
    config:
      loki:
        hostport: http://loki-headless.monitoring.svc.cluster.local:3100
        grafanaDashboard:
          configMap:
            folder: Falco
