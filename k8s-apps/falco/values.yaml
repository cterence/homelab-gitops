falco:
  image:
    tag: 0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e
  falco:
    webserver:
      prometheus_metrics_enabled: true
  resources:
    limits:
      memory: 2Gi
  driver:
    kind: modern_ebpf
  tty: true
  collectors:
    kubernetes:
      enabled: true
  mounts:
    volumes:
      - name: ghcr-dockerconfig
        secret:
          secretName: ghcr-dockerconfig
          items:
            - key: config.json
              path: config.json
  falcoctl:
    artifact:
      install:
        env:
          - name: DOCKER_CONFIG
            value: /dockerconfig
        mounts:
          volumeMounts:
            - name: ghcr-dockerconfig
              mountPath: /dockerconfig
              readOnly: true
  metrics:
    enabled: true
  serviceMonitor:
    create: true
  customRules:
    known-api-server-clients.yaml: |-
      # Trusted controllers legitimately watching the K8s API; the default
      # "Contact K8S API Server From Container" rule references this macro.
      - macro: user_known_contact_k8s_api_server_activities
        condition: >
          (k8smeta.ns.name in (
            argocd, cert-manager, cnpg-restore-test, cnpg-system, external-dns,
            external-secrets, falco, ingress-nginx, kube-system, loki, metallb,
            monitoring, opentelemetry-collector, opentelemetry-operator,
            registry, reloader, sablier, tailscale-operator, traefik, velero
          ))
          or (k8smeta.pod.name contains "cnpg-cluster")
    drop-and-execute-activities.yaml: |-
      - macro: known_drop_and_execute_activities
        condition: >
          (k8smeta.ns.name = "arr-stack"
           and k8smeta.pod.name startswith "arr-stack-flaresolverr"
           and proc.exe = "/app/chromedriver")
          or (k8smeta.ns.name = "music"
           and k8smeta.pod.name startswith "picard-"
           and proc.name = mkfontscale
           and proc.aname[2] = apk)
          or (k8smeta.ns.name = "catbox"
           and k8smeta.pod.name startswith "catbox"
           and proc.exepath = "/usr/sbin/xtables-legacy-multi")
          or proc.aname in (executor)
    cnpg-restore-shell.yaml: |-
      # CNPG restore jobs run as postgres and spawn "sh -c false" probes
      - list: user_known_shell_spawn_binaries
        items: [postgres]
    kaniko-build-activities.yaml: |-
      # Match kaniko by binary, not k8smeta fields: they go stale on a node
      # if the k8smeta stream to the metacollector dies.
      - macro: user_known_read_sensitive_files_activities
        condition: >
          (proc.exepath = "/kaniko/executor"
           or proc.aname in (executor))
          or (container.id = "host"
           and proc.exepath startswith "/nix/store/"
           and proc.cmdline contains "update-users-groups.pl"
           and proc.aname[2] = ".switch-to-conf")
      - macro: allowed_clear_log_files
        condition: >
          (proc.exepath = "/kaniko/executor"
           or proc.aname in (executor))
    k0s-containerd-activities.yaml: |-
      - macro: containerd_activities
        condition: >
          (proc.name = containerd
           and (fd.name startswith "/var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/"
               or fd.name startswith "/var/lib/rancher/k3s/agent/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots"
               or fd.name startswith "/var/lib/containerd/tmpmounts/"
               or fd.name startswith "/var/lib/rancher/k3s/agent/containerd/tmpmounts/"
               or fd.name startswith "/var/lib/k0s/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/"
               or fd.name startswith "/var/lib/k0s/containerd/tmpmounts/"))
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          folder: Falco
  falcosidekick:
    enabled: true
    config:
      existingSecret: falcosidekick-telegram
      telegram:
        minimumpriority: warning
