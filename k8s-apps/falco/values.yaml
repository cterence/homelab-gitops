falco:
  image:
    tag: 0.45.2@sha256:1562a643953f938e02f47319b5214d93a235f11f646d60e9b8a516fd5a64698e
  falco:
    webserver:
      prometheus_metrics_enabled: true
  resources:
    limits:
      memory: 2Gi
  driver:
    kind: modern_ebpf
  tty: true
  collectors:
    kubernetes:
      enabled: true
  metrics:
    enabled: true
  serviceMonitor:
    create: true
  grafana:
    dashboards:
      enabled: true
      configMaps:
        falco:
          folder: Falco
  falcosidekick:
    enabled: true
    config:
      existingSecret: falcosidekick-telegram
      telegram:
        minimumpriority: warning
