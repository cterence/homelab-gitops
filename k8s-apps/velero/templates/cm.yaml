# velero restore create --from-backup velero-default-xxx --namespace-mappings xxx:xxx-bkp --resource-modifier-configmap remove-argocd-instance-label
apiVersion: v1
kind: ConfigMap
metadata:
  name: remove-argocd-instance-label
data:
  cm.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: "*"
          resourceNameRegex: ".*"
        patches:
          - operation: remove
            path: "/metadata/labels/argocd.argoproj.io~1instance"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-policy
data:
  cm.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          volumeTypes:
            - emptyDir
            - downwardAPI
            - configmap
            - cinder
        action:
          type: skip
      - conditions:
          pvcLabels:
            app.kubernetes.io/managed-by: cloudnative-pg
        action:
          type: skip
      - conditions:
          # garage data PVC is velero's own S3 backup target; storageClass skip
          # because the garage chart can't label its volumeClaimTemplates
          storageClass:
            - local-path-storage-pool
        action:
          type: skip
