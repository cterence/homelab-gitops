# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - homelab2

  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        annotations:
          backup.velero.io/backup-volumes-excludes: data,data-storage-pool,music
      containers:
        main:
          image:
            repository: lscr.io/linuxserver/jellyfin
            tag: 12.4ubu2604-ls59@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
          env:
            TZ: Europe/Paris
            PUID: 0
            PGID: 0
          ports:
            - name: http
              containerPort: 8096
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /health

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8096

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.middlewares: traefik-modsecurity@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host jf.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: jellyfin-tls
          hosts:
            - *host

    media:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.priority: "100"
      className: "traefik"
      hosts:
        - host: &host jf.terence.cloud
          paths:
            - path: /videos
              pathType: Prefix
              service:
                identifier: main
                port: http
            - path: /audio
              pathType: Prefix
              service:
                identifier: main
                port: http
            - path: /socket.io
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: jellyfin-tls
          hosts:
            - *host

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 30Gi
      advancedMounts:
        main:
          main:
            - path: /config

    hwa:
      enabled: true
      type: hostPath
      hostPath: /dev/dri/renderD128
      hostPathType: "CharDevice"
      advancedMounts:
        main:
          main:
            - path: /dev/dri/renderD128

    data:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: jellyfin-data
      advancedMounts:
        main:
          main:
            - path: /data/media
              subPath: media

    data-storage-pool:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: jellyfin-storage-pool
      advancedMounts:
        main:
          main:
            - path: /data-pool/media
              subPath: arr-stack/media

    music:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: jellyfin-music
      advancedMounts:
        main:
          main:
            - path: /data/media/music
              subPath: library

  rawResources:
    jellyfin-data-pv:
      enabled: true
      forceRename: jellyfin-data
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 1200Gi
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: shared-local
          claimRef:
            name: jellyfin-data
            namespace: jellyfin
          local:
            path: /opt/local-path-provisioner/pvc-29cf47a1-5baa-49a4-9176-6d0609a3054a_arr-stack_arr-stack-data
          nodeAffinity:
            required:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - homelab2
    jellyfin-data-pvc:
      enabled: true
      forceRename: jellyfin-data
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1200Gi
          storageClassName: shared-local
          volumeName: jellyfin-data
    jellyfin-music-pv:
      enabled: true
      forceRename: jellyfin-music
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 100Gi
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: shared-local
          claimRef:
            name: jellyfin-music
            namespace: jellyfin
          local:
            path: /opt/local-path-provisioner/pvc-08a2cbb6-e7ab-4ba4-b8d4-fc906f0e4931_music_music
          nodeAffinity:
            required:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - homelab2
    jellyfin-music-pvc:
      enabled: true
      forceRename: jellyfin-music
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: shared-local
          volumeName: jellyfin-music
    jellyfin-storage-pool-pv:
      enabled: true
      forceRename: jellyfin-storage-pool
      manifest:
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          capacity:
            storage: 8Ti
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          storageClassName: nfs
          mountOptions:
            - hard
            - nfsvers=4.1
            - nosuid
            - noexec
            - timeo=600
            - retrans=2
          nfs:
            path: /storage-pool
            server: 192.168.1.141
    jellyfin-storage-pool-pvc:
      enabled: true
      forceRename: jellyfin-storage-pool
      manifest:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          annotations:
            helm.sh/resource-policy: keep
          labels:
            velero.io/exclude-from-backup: "true"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Ti
          storageClassName: nfs
          volumeName: jellyfin-storage-pool
