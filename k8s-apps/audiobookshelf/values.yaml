# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"

  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      labels:
        sablier.enable: "true"
        sablier.group: "{{ .Release.Name }}-main"
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image:
            repository: ghcr.io/advplyr/audiobookshelf
            tag: 2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
          env:
            TZ: Europe/Paris
            PORT: 13378
          ports:
            - name: http
              containerPort: 13378
          probes:
            liveness:
              enabled: true
              type: HTTP
            readiness:
              enabled: true
              type: HTTP
    shelfmark:
      type: deployment
      labels:
        sablier.enable: "true"
        sablier.group: "{{ .Release.Name }}-shelfmark"
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
      containers:
        main:
          image:
            repository: ghcr.io/calibrain/shelfmark
            tag: v1.6.2@sha256:0b400a5d58951b35bfede3d9943b632551259c31e130316fe56c5cc0e2e4faea
          env:
            TZ: Europe/Paris
            FLASK_PORT: 8084
            FLASK_DEBUG: false
            CLOUDFLARE_PROXY_URL: http://localhost:8000
            INGEST_DIR: /ebooks
            UID: "0"
            GID: "0"
            APP_ENV: prod
          ports:
            - name: http
              containerPort: 8084
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                failureThreshold: 10
                timeoutSeconds: 5
                httpGet:
                  port: http
                  path: /api/status
            readiness:
              enabled: true
              custom: true
              spec:
                failureThreshold: 10
                timeoutSeconds: 5
                httpGet:
                  port: http
                  path: /api/status
        cloudflare-bypass:
          image:
            repository: ghcr.io/sarperavci/cloudflarebypassforscraping
            tag: latest@sha256:e48f7c080088131808369ecd3ecfdea7cce73c77c2e4de2b06dad4c5767ea685
          env:
            TZ: Europe/Paris
          ports:
            - name: http
              containerPort: 8000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http

    sftp:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
      containers:
        main:
          image:
            repository: atmoz/sftp
            tag: latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
          env:
            TZ: Europe/Paris
            SFTP_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-sftp-password"
                  key: password
          command:
            - /bin/sh
            - -c
            - 'exec /entrypoint "kindle:$SFTP_PASSWORD:568:568"'
          ports:
            - name: sftp
              containerPort: 22
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: sftp
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: sftp

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 13378
    shelfmark:
      controller: shelfmark
      type: ClusterIP
      ports:
        http:
          port: 8084
    sftp:
      controller: sftp
      type: ClusterIP
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: abs-books
      ports:
        sftp:
          port: 22
          targetPort: sftp

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-sablier-main@kubernetescrd,traefik-modsecurity@kubernetescrd"
      className: "traefik"
      hosts:
        - host: &host1 abs.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: abs-tls
          hosts:
            - *host1

    shelfmark:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.tls.options: cert-manager-client-auth@kubernetescrd
        traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-sablier-shelfmark@kubernetescrd"
      className: "traefik"
      hosts:
        - host: &host2 shfm.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: shelfmark
                port: http
      tls:
        - secretName: shelfmark-tls
          hosts:
            - *host2

  persistence:
    config-abs:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 50Mi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /config
    config-shelfmark:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 50Mi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        shelfmark:
          main:
            - path: /config
    metadata:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 50Mi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /metadata
    audiobooks:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /audiobooks
    ebooks:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /ebooks
        shelfmark:
          main:
            - path: /ebooks
        sftp:
          main:
            - path: /home/kindle/ebooks
              readOnly: true
    mangas:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /mangas
        shelfmark:
          main:
            - path: /mangas
        sftp:
          main:
            - path: /home/kindle/mangas
              readOnly: true
    podcasts:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      advancedMounts:
        main:
          main:
            - path: /podcasts

  rawResources:
    sftp-password:
      enabled: true
      forceRename: "{{ .Release.Name }}-sftp-password"
      manifest:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        spec:
          refreshInterval: "0"
          target:
            name: "{{ .Release.Name }}-sftp-password"
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: short-password

    sablier-main:
      enabled: true
      forceRename: "sablier-main"
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: sablier
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: "{{ .Release.Name }}"
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: "{{ .Release.Name }}-main"

    sablier-shelfmark:
      enabled: true
      forceRename: "sablier-shelfmark"
      manifest:
        apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: sablier
        spec:
          plugin:
            sablier:
              dynamic:
                displayName: "{{ .Release.Name }}"
                refreshFrequency: 5s
                showDetails: true
                theme: shuffle
              sablierUrl: http://sablier-sablier.sablier:10000
              sessionDuration: 10m
              ignoreUserAgent: curl
              group: "{{ .Release.Name }}-shelfmark"
