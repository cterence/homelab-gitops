app-template:
  defaultPodOptions:
    automountServiceAccountToken: false

  controllers:
    main:
      type: deployment
      annotations:
        reloader.stakater.com/auto: "true"

      containers:
        main:
          image:
            repository: registry.snow-delta.ts.net/hubble-exporter
            tag: "5"
            pullPolicy: IfNotPresent
          env:
            TZ: Europe/Paris
          args:
            - --state
            - /data/seen.json
            - --migrate
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 100Mi

valkey:
  deploymentStrategy: Recreate
  persistence:
    enabled: true
    size: "1Gi"
    labels:
      velero.io/exclude-from-backup: "true"
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Delete=false
