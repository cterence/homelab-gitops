app-template:
  defaultPodOptions:
    automountServiceAccountToken: false

  controllers:
    main:
      type: deployment
      annotations:
        reloader.stakater.com/auto: "true"

      containers:
        main:
          image:
            repository: quay.io/cilium/hubble
            tag: v1.16.4@sha256:349969284c427d4754fa4b683438571f4678c569f176b076a662027268a3559c
            pullPolicy: IfNotPresent
          command: ["hubble"]
          args:
            - observe
            - --server
            - hubble-relay.kube-system.svc.cluster.local:80
            - --follow
            - -o
            - jsonpb
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
