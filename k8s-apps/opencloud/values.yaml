# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"

  configMaps:
    config:
      data:
        TZ: Europe/Paris
        START_ADDITIONAL_SERVICES: "auth-app"
        FRONTEND_ARCHIVER_MAX_SIZE: "50000000000"

        OC_INSECURE: "false"
        OC_URL: https://oc.terence.cloud
        OC_OIDC_ISSUER: https://auth.terence.cloud
        OC_EXCLUDE_RUN_SERVICES: idp

        STORAGE_SYSTEM_DRIVER: decomposed
        STORAGE_USERS_DRIVER: decomposeds3
        STORAGE_USERS_DECOMPOSEDS3_ENDPOINT: "http://garage.garage:3900"
        STORAGE_USERS_DECOMPOSEDS3_REGION: us-east-1
        STORAGE_USERS_DECOMPOSEDS3_BUCKET: opencloud

        IDP_DOMAIN: auth.terence.cloud
        IDP_ISSUER_URL: https://auth.terence.cloud

        PROXY_TLS: "false"
        PROXY_HTTP_ADDR: 0.0.0.0:9200
        PROXY_ENABLE_APP_AUTH: "true"
        PROXY_OIDC_CLIENT_ID: cf0733c2-3f6e-4e3a-a47f-4b403e8b76f1
        PROXY_OIDC_REWRITE_WELLKNOWN: "true"
        PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
        PROXY_USER_OIDC_CLAIM: preferred_username
        PROXY_USER_CS3_CLAIM: username
        PROXY_AUTOPROVISION_ACCOUNTS: "true"
        PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
        PROXY_AUTOPROVISION_CLAIM_EMAIL: email
        PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
        PROXY_AUTOPROVISION_CLAIM_GROUPS: groups
        PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
        PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: opencloud_role

        WEB_OIDC_CLIENT_ID: cf0733c2-3f6e-4e3a-a47f-4b403e8b76f1
        WEB_OIDC_METADATA_URL: https://auth.terence.cloud/.well-known/openid-configuration
        WEB_OIDC_RESPONSE_TYPE: code
        WEB_OIDC_SCOPE: openid profile email groups

        GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
        GRAPH_USERNAME_MATCH: none

  controllers:
    main:
      type: deployment
      strategy: Recreate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        terminationGracePeriodSeconds: 360
      initContainers:
        init:
          image:
            repository: opencloudeu/opencloud-rolling
            tag: 9.1.0@sha256:f902f3cb5c247e3780dc133476c4c4f8d3377a638f15734d1d926c5f011c1fa7
          command: "/bin/bash"
          args:
            - -c
            - "opencloud init || true"
          envFrom:
            - configMapRef:
                identifier: config
      containers:
        main:
          image:
            repository: opencloudeu/opencloud-rolling
            tag: 9.1.0@sha256:f902f3cb5c247e3780dc133476c4c4f8d3377a638f15734d1d926c5f011c1fa7
          envFrom:
            - configMapRef:
                identifier: config
            - secretRef:
                name: garage-credentials
          ports:
            - name: http
              containerPort: 9200
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /status
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /status
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    i=0
                    while [ $i -lt 30 ]; do
                      n=$(opencloud storage-users uploads sessions --processing --json 2>/dev/null | grep -c '"status":"processing"')
                      [ "$n" -eq 0 ] && break
                      sleep 10
                      i=$((i+1))
                    done

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 9200

  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-ip-allowlist@kubernetescrd,traefik-modsecurity@kubernetescrd
      className: "traefik"
      hosts:
        - host: &host oc.terence.cloud
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: opencloud-tls
          hosts:
            - *host

    data:
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.kubernetes.io/target: home.terence.cloud
        external-dns.kubernetes.io/cloudflare-proxied: "false"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-ip-allowlist@kubernetescrd
        traefik.ingress.kubernetes.io/router.priority: "100"
      className: "traefik"
      hosts:
        - host: *host
          paths:
            - path: /dav/
              pathType: Prefix
              service:
                identifier: main
                port: http
            - path: /data/
              pathType: Prefix
              service:
                identifier: main
                port: http
            - path: /remote.php/dav/
              pathType: Prefix
              service:
                identifier: main
                port: http
            - path: /remote.php/webdav/
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: opencloud-tls
          hosts:
            - *host

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 100Mi
      advancedMounts:
        main:
          main:
            - path: /etc/opencloud
          init:
            - path: /etc/opencloud

    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 100Gi
      advancedMounts:
        main:
          main:
            - path: /var/lib/opencloud
          init:
            - path: /var/lib/opencloud
