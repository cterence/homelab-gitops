# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    imagePullSecrets:
      - name: registry-pull-secret

  configMaps:
    config:
      data:
        TZ: Europe/Paris
        CACHE_TYPE: file
        BROWSER_URL: http://localhost:9222
        LOG_LEVEL: info
        DELETE: "true"

  controllers:
    app:
      type: cronjob
      cronjob:
        schedule: "0 0 * * *"
        successfulJobsHistory: 1
        failedJobsHistory: 1
        concurrencyPolicy: Forbid
        timeZone: Europe/Paris
      pod:
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 1000
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        app:
          image:
            repository: registry.terence.cloud/lastfm-scrobble-deduplicator
            tag: "22"
            pullPolicy: IfNotPresent
          args:
            - --from
            - yesterday
          envFrom:
            - configMapRef:
                identifier: config
            - secretRef:
                name: lastfm-credentials
      # Long lived sidecars with restartPolicy: Always
      initContainers:
        chromium:
          image:
            repository: ghcr.io/browserless/chromium
            tag: latest@sha256:bcad9a1c271ddb9d95f7de5981c68cb2fcc9fd1f07e8da07c4e5c9d1ef4fc099
          # Headful chromium under Xvfb: last.fm's Fastly bot mitigation
          # blocks every headless browser tested.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CHROME=$(ls /usr/local/bin/playwright-browsers/chromium-*/chrome-linux64/chrome | head -n 1)
              # shortcut: no exec — chrome dies instantly when pid 1 is the xvfb-run script
              xvfb-run -a "$CHROME" \
                --remote-debugging-address=0.0.0.0 \
                --remote-debugging-port=9222 \
                --user-data-dir=/tmp/chrome-profile \
                --no-sandbox \
                --no-first-run \
                --disable-crash-reporter \
                --disable-dev-shm-usage \
                --disable-blink-features=AutomationControlled \
                --window-size=1280,1024 \
                about:blank
          ports:
            - name: http
              containerPort: 9222
          env:
            TZ: Europe/Paris
            HOME: /tmp
          restartPolicy: Always
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /json/version
                failureThreshold: 30
                periodSeconds: 2
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /json/version
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /json/version

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 200Mi
      advancedMounts:
        app:
          app:
            - path: /app/data
