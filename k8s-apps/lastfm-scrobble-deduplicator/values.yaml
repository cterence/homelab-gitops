# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    imagePullSecrets:
      - name: registry-pull-secret

  configMaps:
    config:
      data:
        TZ: Europe/Paris
        CACHE_TYPE: file
        BROWSER_URL: ws://localhost:3000?token=local
        LOG_LEVEL: info
        DELETE: "true"

  controllers:
    app:
      type: cronjob
      cronjob:
        schedule: "0 0 * * *"
        successfulJobsHistory: 1
        failedJobsHistory: 1
        concurrencyPolicy: Forbid
        timeZone: Europe/Paris
      pod:
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 1000
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        app:
          image:
            repository: registry.terence.cloud/lastfm-scrobble-deduplicator
            tag: "14"
            pullPolicy: IfNotPresent
          args:
            - --from
            - yesterday
          envFrom:
            - configMapRef:
                identifier: config
            - secretRef:
                name: lastfm-credentials
      # Long lived sidecars with restartPolicy: Always
      initContainers:
        chromium:
          image:
            repository: ghcr.io/browserless/chromium
            tag: latest@sha256:a631d6fcf9da17b5ff34f2a405e84a528659c1dce748cc87f741bc6220b54ffb
          ports:
            - name: http
              containerPort: 3000
          env:
            TZ: Europe/Paris
            TOKEN: local
            DEBUG: -*
            TIMEOUT: 600000
          restartPolicy: Always
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /active?token=local
                failureThreshold: 30
                periodSeconds: 2
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /active?token=local
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  port: http
                  path: /active?token=local

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      annotations:
        helm.sh/resource-policy: keep
        argocd.argoproj.io/sync-options: Delete=false
      accessMode: ReadWriteOnce
      size: 200Mi
      advancedMounts:
        app:
          app:
            - path: /app/data
