# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    # Root is required to create the plugin socket in the kubelet device
    # plugin directory; the binary touches nothing else.
    securityContext:
      runAsUser: 0
      runAsGroup: 0

  controllers:
    # Fleet-wide: the iGPU render node exists on every node.
    render:
      type: daemonset
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image: &image
            repository: registry.snow-delta.ts.net/device-plugin
            tag: "9"
            pullPolicy: IfNotPresent
          resources: &resources
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # Kubelet drops the plugin sockets on restart; the binary
          # re-registers, and this probe restarts it if it stays unregistered.
          livenessProbe: &livenessProbe
            exec:
              command:
                - /usr/local/bin/device-plugin
                - probe
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

    # /dev/net/tun exists on every node; consumed by the arr-stack gluetun
    # sidecar.
    tun:
      type: daemonset
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      containers:
        main:
          image: *image
          resources: *resources
          livenessProbe: *livenessProbe

    # The ConBee stick is USB: a CharDevice mount only exists on homelab2,
    # so this DaemonSet is pinned there.
    conbee:
      type: daemonset
      strategy: RollingUpdate
      annotations:
        reloader.stakater.com/auto: "true"
      pod:
        nodeSelector:
          kubernetes.io/hostname: homelab2
      containers:
        main:
          image: *image
          resources: *resources
          livenessProbe: *livenessProbe

  configMaps:
    config-render:
      enabled: true
      forceRename: device-plugin-config-render
      data:
        config.yaml: |
          devices:
            - resource: homelab.io/render
              path: /dev/dri/renderD128
              count: 16
    config-tun:
      enabled: true
      forceRename: device-plugin-config-tun
      data:
        config.yaml: |
          devices:
            - resource: homelab.io/tun
              path: /dev/net/tun
    config-conbee:
      enabled: true
      forceRename: device-plugin-config-conbee
      data:
        config.yaml: |
          devices:
            - resource: homelab.io/conbee
              path: /dev/ttyACM0

  persistence:
    # Exact device nodes, bind-mounted read-only for the health stat. Never
    # mount the parent /dev read-only: it shadows runc's own /dev.
    dev-render:
      enabled: true
      type: hostPath
      hostPath: /dev/dri/renderD128
      hostPathType: CharDevice
      advancedMounts:
        render:
          main:
            - path: /dev/dri/renderD128
              readOnly: true
    dev-tun:
      enabled: true
      type: hostPath
      hostPath: /dev/net/tun
      hostPathType: CharDevice
      advancedMounts:
        tun:
          main:
            - path: /dev/net/tun
              readOnly: true
    dev-conbee:
      enabled: true
      type: hostPath
      hostPath: /dev/ttyACM0
      hostPathType: CharDevice
      advancedMounts:
        conbee:
          main:
            - path: /dev/ttyACM0
              readOnly: true
    kubelet-device-plugins:
      enabled: true
      type: hostPath
      hostPath: /var/lib/kubelet/device-plugins
      hostPathType: Directory
      advancedMounts:
        render:
          main:
            - path: /var/lib/kubelet/device-plugins
        tun:
          main:
            - path: /var/lib/kubelet/device-plugins
        conbee:
          main:
            - path: /var/lib/kubelet/device-plugins
    config-render:
      type: configMap
      name: device-plugin-config-render
      advancedMounts:
        render:
          main:
            - path: /app/config.yaml
              readOnly: true
              subPath: config.yaml
    config-tun:
      type: configMap
      name: device-plugin-config-tun
      advancedMounts:
        tun:
          main:
            - path: /app/config.yaml
              readOnly: true
              subPath: config.yaml
    config-conbee:
      type: configMap
      name: device-plugin-config-conbee
      advancedMounts:
        conbee:
          main:
            - path: /app/config.yaml
              readOnly: true
              subPath: config.yaml
